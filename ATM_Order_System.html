window.confirmAndSubmitOrder = function(custId) {
  if (!Array.isArray(CART) || CART.length === 0) {
    return alert('주문 내역이 비어 있습니다.\nCart is empty.');
  }
  // 수량 미입력 / 0 품목 검증 — 빈칸 기본값으로 인한 사고 방지
  const emptyQty = CART.filter(it => it.quantity == null || it.quantity === '' || isNaN(it.quantity) || Number(it.quantity) <= 0);
  if (emptyQty.length > 0) {
    const names = emptyQty.map(it => {
      const p = DB.products.find(x => x.id === it.productId);
      return p ? p.name : '(품목)';
    }).join(', ');
    return alert('❌ 수량 미입력 품목이 있습니다:\n' + names + '\n\n수량을 입력해 주세요.');
  }
  const todayISO = todayLocalISO();
  const tmr = new Date(); tmr.setDate(tmr.getDate() + 1);
  const tomorrowISO = toLocalISODate(tmr);
  const tomorrowDMY = formatDateDMY(tomorrowISO);
  // ⭐ (2026-08-02) 주말·휴무 통합 판정 — 내일이 영업일 아니면 다음 첫 영업일 안내
  let tomorrowLabel;
  if (isBusinessDay(tomorrowISO)) {
    tomorrowLabel = `🚚 <b>내일 배송 / Tomorrow</b><div style="font-weight:400; font-size:12px; opacity:0.9; margin-top:2px;">${tomorrowDMY}</div>`;
  } else {
    const nextBiz = getFirstBusinessDayOnOrAfter(tomorrowISO);
    const nextDMY = formatDateDMY(nextBiz);
    let reasonBadge;
    if (isHolidayDate(tomorrowISO)) reasonBadge = '(휴무 — ' + formatDateShort(nextBiz) + ' 배송)';
    else reasonBadge = '(주말 — ' + formatDateShort(nextBiz) + ' 배송)';
    tomorrowLabel = `🚚 <b>내일 배송 / Tomorrow</b><div style="font-weight:400; font-size:12px; opacity:0.9; margin-top:2px;">${tomorrowDMY} <span style="color:#E8A317; font-weight:700;">${reasonBadge}</span></div>`;
  }
  // 지정일 기본값: 모레
  const day3 = new Date(); day3.setDate(day3.getDate() + 2);
  const day3ISO = toLocalISODate(day3);

  openModal(`
    <h3 style="margin-top:0;">🚚 배송일 선택 / Choose Delivery Date</h3>
    <p style="font-size:13px; color:var(--muted); margin:0 0 16px 0;">
      언제 받으실지 선택해 주세요.<br>
      <span style="font-size:12px;">When would you like to receive this order?</span>
    </p>
    <div style="display:grid; grid-template-columns: 1fr; gap:10px;">
      ${!CUSTOMER_MODE ? `
      <button class="btn success" style="padding:14px; font-size:15px; text-align:left;" onclick="setDeliveryAndSubmit('${custId}', '${todayISO}')">
        📦 <b>오늘 배송 / Today</b> <span style="font-size:11px; opacity:0.85;">(직원 전용)</span>
        <div style="font-weight:400; font-size:12px; opacity:0.9; margin-top:2px;">${formatDateDMY(todayISO)}</div>
      </button>` : ''}
      <button class="btn" style="padding:14px; font-size:15px; text-align:left;" onclick="handleTomorrowDelivery('${custId}')">
        ${tomorrowLabel}
      </button>
      <button class="btn secondary" id="btnCustomDate" style="padding:14px; font-size:15px; text-align:left;" onclick="showCustomDateInput()">
        📅 <b>지정일 배송 / Choose Date</b>
        <div style="font-weight:400; font-size:12px; opacity:0.8; margin-top:2px;">달력에서 직접 선택 / Pick from calendar</div>
      </button>
    </div>
    <div id="customDateBox" style="display:none; margin-top:14px; padding:14px; background:var(--surface); border:1px solid var(--line); border-radius:8px;">
      <div class="field" style="margin-bottom:10px;">
        <label>배송 희망일 / Delivery Date</label>
        <input type="date" id="customDeliveryDate" min="${todayISO}" value="${day3ISO}" style="font-size:15px; padding:10px; width:100%;">
      </div>
      <button class="btn success" style="width:100%; padding:12px;" onclick="submitCustomDate('${custId}')">
        ✅ 확인 후 제출 / Confirm &amp; Submit
      </button>
    </div>
    ${_renderHolidayNoticeBox()}
    <div style="margin-top:16px; text-align:center; padding-top:12px; border-top:1px solid var(--line);">
      <button class="btn secondary sm" onclick="closeModal()">취소 / Cancel</button>
    </div>
  `);
};

// ⭐ (2026-08-02) 배송일 선택 모달 하단 휴무 공지 박스
//   "M월 D일 휴무 -> M월 D일 배송 합니다" 형식으로 다가올 휴무 표시
function _renderHolidayNoticeBox() {
  const upcoming = (typeof upcomingHolidayRanges === 'function') ? upcomingHolidayRanges() : [];
  if (upcoming.length === 0) return '';
  const rows = upcoming.map(function(h) {
    const nextBiz = getFirstBusinessDayOnOrAfter(_addDaysISO(h.end, 1));
    if (h.start === h.end) {
      return formatDateShort(h.start) + ' 휴무 -> ' + formatDateShort(nextBiz) + ' 배송 합니다';
    }
    return formatDateShort(h.start) + ' ~ ' + formatDateShort(h.end) + ' 휴무 -> ' + formatDateShort(nextBiz) + ' 배송 합니다';
  }).join('<br>');
  return '<div style="margin-top:14px; padding:12px 14px; background:#FFF7E0; border-left:4px solid #B8860B; border-radius:6px; font-size:13px; color:#5C3A00; line-height:1.7;">'
    + '<b style="color:#7A4A00;">📢 휴무 안내</b><br>' + rows
    + '</div>';
}
// 헬퍼: dateISO + N일
function _addDaysISO(dateISO, n) {
  const d = new Date(dateISO + 'T12:00:00');
  d.setDate(d.getDate() + n);
  return toLocalISODate(d);
}

window.showCustomDateInput = function() {
  const box = document.getElementById('customDateBox');
  const btn = document.getElementById('btnCustomDate');
  if (box) box.style.display = 'block';
  if (btn) btn.style.opacity = '0.55';
  // 자동 포커스
  setTimeout(() => {
    const inp = document.getElementById('customDeliveryDate');
    if (inp) inp.focus();
  }, 50);
};

window.submitCustomDate = function(custId) {
  const v = (document.getElementById('customDeliveryDate') || {}).value || '';
  if (!v) return alert('날짜를 선택해 주세요.\nPlease pick a date.');
  // ⭐ (2026-08-02) 지정일 검증 — 주말·휴무 기간이면 다음 영업일로 자동 조정 확인
  if (!isBusinessDay(v)) {
    const nextBiz = getFirstBusinessDayOnOrAfter(v);
    const reason = isHolidayDate(v) ? '휴무 기간입니다' : '주말입니다';
    const ok = confirm(
      '선택하신 ' + formatDateDMY(v) + ' 은 ' + reason + '.\n' +
      formatDateDMY(nextBiz) + ' 배송으로 진행할까요?'
    );
    if (!ok) return;   // 취소 시 사장님이 다시 선택
    setDeliveryAndSubmit(custId, nextBiz);
    return;
  }
  setDeliveryAndSubmit(custId, v);
};

// ⭐ (2026-08-01) 중복 제출 방어 — 방어 1 (버튼 비활성화) + 방어 3 (서명 dedupe)
//   방어 1: 배송일 모달 & 확인 화면 하단 버튼 즉시 회색·클릭 불가 → 재클릭 UX 차단
//   방어 3: submitOrder 안에서 CART+거래처 서명으로 8초 내 중복 재제출 시스템 레벨 차단
window.setDeliveryAndSubmit = function(custId, dateISO) {
  // 배송일 모달의 모든 버튼 즉시 비활성화 → 재클릭 원천 차단
  const modal = document.getElementById('modalBg');
  if (modal) {
    modal.querySelectorAll('button, input').forEach(function(b){
      b.disabled = true;
      b.style.opacity = '0.5';
      b.style.cursor = 'not-allowed';
      b.style.pointerEvents = 'none';
    });
  }
  // 확인 화면 하단 제출 버튼도 비활성화
  const cbSubmit = document.querySelector('.order-confirm-bar .ocb-submit');
  if (cbSubmit) { cbSubmit.disabled = true; cbSubmit.style.opacity = '0.5'; cbSubmit.style.cursor = 'not-allowed'; cbSubmit.style.pointerEvents = 'none'; }
  const el = document.getElementById('deliveryDate');
  if (el) el.value = dateISO;
  closeModal();
  // ⭐ (2026-08-02) 파라미터 명시 전달 — 2단계 확인 화면에서도 정상 저장
  submitOrder(custId, dateISO);
};

// ⭐ (2026-08-02) 내일 배송 클릭 처리 — 주말·휴무 자동 스킵 후 첫 영업일로 배송
window.handleTomorrowDelivery = function(custId) {
  const tmr = new Date(); tmr.setDate(tmr.getDate() + 1);
  const tmrISO = toLocalISODate(tmr);
  const targetISO = getFirstBusinessDayOnOrAfter(tmrISO);
  if (targetISO === tmrISO) {
    // 내일이 이미 영업일 → 그대로 진행
    setDeliveryAndSubmit(custId, tmrISO);
    return;
  }
  // 내일이 주말 또는 휴무 → 다음 영업일 확인 팝업
  const targetDMY = formatDateDMY(targetISO);
  const targetDate = new Date(targetISO + 'T12:00:00');
  const dowLabel = ['일','월','화','수','목','금','토'][targetDate.getDay()];
  let reason = '';
  const tmrDow = tmr.getDay();
  if (tmrDow === 0) reason = '내일은 일요일입니다.';
  else if (tmrDow === 6) reason = '내일은 토요일입니다.';
  else if (isHolidayDate(tmrISO)) reason = '내일은 휴무일입니다.';
  else reason = '내일은 영업일이 아닙니다.';
  const ok = confirm(
    reason + '\n' +
    targetDMY + ' (' + dowLabel + '요일) 배송으로 진행됩니다.\n\n' +
    '확인하시겠습니까?'
  );
  if (ok) setDeliveryAndSubmit(custId, targetISO);
  // 취소 시 모달 유지 — 사용자가 지정일 배송 선택 가능
};

async function submitOrder(custId, deliveryDateISO) {
  // ⭐ (2026-08-01) 중복 제출 최종 방어 — 최근 5초 내 같은 거래처+CART 로 제출한 이력 있으면 차단
  //   인터넷 느린 곳에서 setDeliveryAndSubmit 우회로 재진입되는 극단 케이스 방어.
  const _dedupeKey = 'atm_submit_dedupe';
  const _now = Date.now();
  const _cartSig = String(CART.length) + ':' + CART.map(function(i){ return i.productId + '_' + (i.quantity||0) + '_' + (i.unit||''); }).join('|');
  const _mySig = custId + '::' + _cartSig;
  try {
    const _last = JSON.parse(sessionStorage.getItem(_dedupeKey) || 'null');
    if (_last && _last.sig === _mySig && (_now - _last.ts) < 8000) {
      alert('⚠️ 조금 전 제출한 것과 동일한 주문입니다.\n중복 제출을 방지했습니다.\n\nDuplicate submission blocked (same order within 8 seconds).');
      return;
    }
    sessionStorage.setItem(_dedupeKey, JSON.stringify({ sig: _mySig, ts: _now }));
  } catch(_){}
  // ⭐ (2026-07-28) 방어 1/3: 거래처 미지정 상태 주문 생성 차단 (orphan 예방)
  if (!custId || String(custId).trim() === '') {
    return alert('⚠️ 거래처가 지정되지 않았습니다.\n주문 링크를 다시 확인하거나 관리자에게 문의하세요.');
  }
  if (CART.length === 0) return alert('주문 품목을 추가해주세요.');

  // Phase 2 동시성: 트랜잭션으로 orderSeq 를 안전하게 증가시켜 주문번호 중복 방지
  // (두 거래처가 동시에 주문 제출해도 서로 다른 번호 보장)
  let orderSeq = 0;
  if (DB_REF) {
    // 버그 수정 (2026-06-12): 트랜잭션 *전* 에 _lastSaveTime 설정 — 그렇지 않으면
    // local-apply 단계에서 value 리스너가 isSelf=false 로 잘못 판단해 빨간 배너 + DB 덮어쓰기.
    _lastSaveTime = Date.now();
    try {
      const result = await DB_REF.child('settings/orderSeq').transaction(curr => {
        const next = (typeof curr === 'number' && curr > 0) ? curr : 1;
        return next + 1;
      });
      // 서버 확정 후에도 _lastSaveTime 재설정 (네트워크 지연 시 후속 리스너 발사 방어)
      _lastSaveTime = Date.now();
      if (result && result.committed) {
        const newVal = result.snapshot.val();
        if (typeof newVal === 'number') {
          orderSeq = newVal - 1;
          if (!DB.settings) DB.settings = {};
          DB.settings.orderSeq = newVal;
        }
      }
    } catch(e) {
      console.warn('orderSeq transaction failed, using local counter:', e);
    }
  }
  if (!orderSeq) {
    orderSeq = (DB.settings.orderSeq || 1);
    DB.settings.orderSeq = orderSeq + 1;
  }

  // ⭐ (2026-08-02) 배송일 결정 — 파라미터 우선, 없으면 hidden input 폴백 (기존 호환)
  const _hiddenDate = val('deliveryDate');
  const _finalDeliveryDate = (deliveryDateISO && String(deliveryDateISO).trim()) || _hiddenDate || '';
  const _deliveryNotesInput = document.getElementById('deliveryNotes');
  const _finalDeliveryNotes = _deliveryNotesInput ? (_deliveryNotesInput.value || '') : '';
  // 확인 화면(orderConfirm) 통해 왔으면 draft 에 저장된 값 복원
  let _finalNotes = _finalDeliveryNotes;
  if (!_finalNotes) {
    try {
      const draft = loadCartDraft(custId);
      if (draft && draft.deliveryNotes) _finalNotes = draft.deliveryNotes;
    } catch(_){}
  }

  const order = {
    id: uid('o'),
    orderNo: 'ATM-' + todayLocalISO().replace(/-/g,'') + '-' + String(orderSeq).padStart(3,'0'),
    customerId: custId,
    orderDate: new Date().toISOString(),
    deliveryDate: _finalDeliveryDate,
    deliveryNotes: _finalNotes,
    items: CART.map(i => ({...i, actualWeightKg: null})), // 박스육·작업육 모두 계근 후 직원이 입력
    status: 'new',
    createdAt: new Date().toISOString()
  };
  DB.orders.push(order);

  // Auto-add ordered (productId + notes) pairs to customer favourites
  // Same product with different notes => separate favorite cards.
  const custForFav = DB.customers.find(c => c.id === custId);
  if (custForFav) {
    custForFav.favoritePairs = Array.isArray(custForFav.favoritePairs) ? custForFav.favoritePairs : [];
    CART.forEach(item => {
      addFavoritePair(custForFav, item.productId, item.notes || '');
    });
  }

  // 항상 먼저 이 기기(localStorage)에 저장
  saveLocalDB();

  // 하나의 창에서 "전송 중 → 접수 완료"를 보여준다.
  // 확인 버튼은 서버(Firebase)가 주문을 실제로 받은 게 확인된 뒤에만 눌리도록 비활성화로 시작한다.
  openModal(
    '<style>@keyframes atmspin{to{transform:rotate(360deg)}}</style>' +
    '<div id="submitState" style="text-align:center; padding:6px 4px 2px;">' +
      '<div style="display:inline-flex; align-items:center; gap:10px; background:#2E7D32; color:#fff; padding:11px 18px; border-radius:9px; font-size:14px; font-weight:600;">' +
        '<span style="width:16px; height:16px; border:2.5px solid rgba(255,255,255,0.4); border-top-color:#fff; border-radius:50%; display:inline-block; animation:atmspin 0.8s linear infinite;"></span>' +
        '주문을 서버로 보내는 중…' +
      '</div>' +
    '</div>' +
    '<div class="btn-row" style="justify-content:center; margin-top:18px;">' +
      '<button id="submitOkBtn" class="btn" disabled style="opacity:0.45; cursor:not-allowed; min-width:96px;">확인</button>' +
    '</div>'
  );
  // 전송 중에는 바깥 영역 클릭으로 창이 닫히지 않도록 막는다.
  const _bg = document.getElementById('modalBg');
  if (_bg) _bg.onclick = null;

  // Phase 2 동시성: 전체 DB 덮어쓰기 대신 신규 주문을 트랜잭션으로 push.
  // 거래처 favorites 도 부분 업데이트 (다른 거래처 주문과 충돌 없음).
  const delivered = !DB_REF ? true : await new Promise(resolve => {
    let done = false;
    const finish = ok => { if (!done) { done = true; clearTimeout(timer); resolve(ok); } };
    const timer = setTimeout(() => finish(false), 12000); // 12초 내 확인 못하면 실패로 간주
    _lastSaveTime = Date.now();
    DB_REF.child('orders').transaction(currentList => {
      const list = Array.isArray(currentList) ? currentList.slice() : [];
      if (list.some(x => x && x.id === order.id)) return list; // 이미 추가됨
      list.push(order);
      return list;
    }, (error, committed) => {
      if (committed && !error) {
        // 거래처 favorites 부분 업데이트 (fire-and-forget)
        if (custForFav) saveEntityField('customers', custId, 'favoritePairs');
        finish(true);
      } else {
        // 트랜잭션 실패 시 전체 저장으로 폴백
        DB_REF.set(DB).then(() => finish(true)).catch(() => finish(false));
      }
    });
  });

  const stateEl = document.getElementById('submitState');
  const okBtn = document.getElementById('submitOkBtn');

  if (delivered) {
    if (stateEl) stateEl.innerHTML =
      '<div style="font-size:44px; line-height:1; margin-bottom:10px;">✅</div>' +
      '<div style="font-size:17px; font-weight:700; color:#2E7D32;">주문이 정상 접수되었습니다</div>' +
      '<div style="font-size:12px; color:var(--muted); margin-top:7px;">주문번호: ' + order.orderNo + '</div>';
    if (okBtn) {
      okBtn.disabled = false;
      okBtn.style.opacity = '1';
      okBtn.style.cursor = 'pointer';
      okBtn.classList.add('success');
      okBtn.onclick = function(){ closeModal(); CART = []; clearCartDraft(); location.hash = '#orderDetail?id=' + order.id; };
    }
  } else {
    // 서버 전송이 확인되지 않음 → 중복 방지를 위해 방금 추가한 주문을 로컬에서 제거하고, 장바구니는 유지해 재시도 가능하게 둔다.
    DB.orders = DB.orders.filter(x => x.id !== order.id);
    saveLocalDB();
    if (stateEl) stateEl.innerHTML =
      '<div style="font-size:44px; line-height:1; margin-bottom:10px;">⚠️</div>' +
      '<div style="font-size:16px; font-weight:700; color:#C62828;">주문 전송이 확인되지 않았습니다</div>' +
      '<div style="font-size:12px; color:var(--muted); margin-top:7px;">인터넷 연결을 확인한 뒤<br>다시 [주문 제출]을 눌러 주세요.</div>';
    if (okBtn) {
      okBtn.disabled = false;
      okBtn.style.opacity = '1';
      okBtn.style.cursor = 'pointer';
      okBtn.textContent = '닫기';
      okBtn.onclick = function(){ closeModal(); }; // 장바구니 유지 → 바로 재시도 가능
    }
  }
}

// ⭐ (2026-08-01) 계근 대기 색상 배분 시스템
//   태블릿 4명이 자율적으로 담당 거래처 색상 지정. 상단 팔레트에서 색 선택 후 리스트 터치.
//   색상 데이터: order.assignedColor ('red'|'blue'|'yellow'|'pink'|'green'|null)
//   활성 색상·필터 상태는 localStorage 에 태블릿별 저장.
const WH_COLORS = {
  red:    { bg: '#FFEBEE', border: '#E57373', dot: '#E53935', label: '빨강' },
  yellow: { bg: '#FFF9C4', border: '#FFD54F', dot: '#F9A825', label: '노랑' },

window._whFilterColor = window._whFilterColor || null;   // 필터 색상 (null=전체)
window._whFilterOn = window._whFilterOn || false;
try {

} catch(_){}

window.whPickColor = function(color) {

  try { localStorage.setItem('atm_wh_active_color', color || ''); } catch(_){}

window.whToggleFilter = function() {

// ⭐ (2026-08-02) 계근 대기 - 미지정 배송일 즉시 지정 UI
//   미지정 주문에만 [📅 지정] 버튼 표시. 클릭 시 날짜 선택 모달 → 저장.
window.whSetDeliveryDate = function(orderId) {
  const o = DB.orders.find(x => x.id === orderId);
  if (!o) { alert('주문을 찾을 수 없습니다.'); return; }
  const cust = DB.customers.find(c => c.id === o.customerId);
  const today = todayLocalISO();
  const tmr = new Date(); tmr.setDate(tmr.getDate() + 1);
  const tmrISO = toLocalISODate(tmr);
  const suggested = (typeof getFirstBusinessDayOnOrAfter === 'function') ? getFirstBusinessDayOnOrAfter(tmrISO) : tmrISO;
  if (typeof openModal !== 'function') {
    // 폴백: 간단한 prompt
    const v = prompt('배송일 지정 (YYYY-MM-DD)', suggested);
    if (!v || !/^\d{4}-\d{2}-\d{2}$/.test(v)) return;
    _whCommitDeliveryDate(orderId, v);
    return;
  }
  openModal(
    '<h3 style="margin-top:0;">📅 배송일 지정</h3>' +
    '<div style="font-size:13px; color:var(--muted); margin-bottom:10px;">' +
      '<b>' + (cust ? cust.name : '-') + '</b> · 주문번호: ' + o.orderNo +
    '</div>' +
    '<div class="field" style="margin-bottom:12px;">' +
      '<label>배송일 / Delivery Date</label>' +
      '<input type="date" id="whDeliveryDatePicker" min="' + today + '" value="' + suggested + '" style="font-size:15px; padding:10px; width:100%;">' +
    '</div>' +
    '<div class="btn-row" style="margin-top:16px;">' +
      '<button class="btn success" onclick="_whCommitDeliveryDate(\'' + orderId + '\', document.getElementById(\'whDeliveryDatePicker\').value)">✅ 저장</button>' +
      '<button class="btn secondary" onclick="closeModal()">취소</button>' +
    '</div>'
  );
};
window._whCommitDeliveryDate = function(orderId, dateISO) {
  if (!dateISO || !/^\d{4}-\d{2}-\d{2}$/.test(dateISO)) {
    alert('올바른 날짜를 선택해 주세요.');
    return;
  }
  const o = DB.orders.find(x => x.id === orderId);
  if (!o) { alert('주문을 찾을 수 없습니다.'); return; }
  o.deliveryDate = dateISO;
  try { saveEntityField('orders', o.id, 'deliveryDate'); }
  catch(e) { console.warn('배송일 저장 실패:', e); alert('저장 실패: ' + e.message); return; }
  if (typeof closeModal === 'function') closeModal();
  if (typeof renderWarehouseList === 'function') renderWarehouseList();
  if (typeof showToast === 'function') showToast('✅ 배송일 저장 완료: ' + formatDateDMY(dateISO));
};

window.whAssignColor = function(orderId) {
  const o = DB.orders.find(x => x.id === orderId);
  if (!o) return;
  const target = window._whActiveColor || null;   // null=지우개
  if (o.assignedColor === target) {
    // 같은 색 다시 클릭 → 해제
    o.assignedColor = null;
  } else {
    o.assignedColor = target;
  }
  try { saveEntityField('orders', orderId, 'assignedColor'); } catch(e) { console.warn('assignedColor 저장 실패:', e); }
  renderWarehouseList();
};

// ⭐ (2026-08-07) 계근 대기 - 배송일 일괄 변경
window.openBulkDeliveryChange = function() {
  const modal = document.getElementById('bulkDeliveryModal');
  if (!modal) return;
  modal.style.display = 'flex';
  // 오늘 기본값
  const d = document.getElementById('bulkNewDate');
  if (d) d.value = todayLocalISO();
  const chk = document.getElementById('bulkAllChk');
  if (chk) chk.checked = false;
  _renderBulkOrderList();
  _updateBulkSelCount();
};

window.closeBulkDeliveryChange = function() {
  const modal = document.getElementById('bulkDeliveryModal');
  if (modal) modal.style.display = 'none';
};

function _renderBulkOrderList() {
  const box = document.getElementById('bulkOrderList');
  if (!box) return;
  const _custNameOf = function(o) {
    const c = (DB.customers||[]).find(x => x.id === o.customerId);
    return (c && c.name) || '';
  };
  const pending = (DB.orders||[]).filter(o => o.status === 'new' || o.status === 'weighing')
    .sort((a,b) => _custNameOf(a).localeCompare(_custNameOf(b), 'ko-KR'));
  if (pending.length === 0) {
    box.innerHTML = '<div style="color:var(--muted); padding:12px; text-align:center;">계근 대기 주문 없음</div>';
    return;
  }
  let html = '';
  pending.forEach(o => {
    const cn = _custNameOf(o) || '-';
    const dd = o.deliveryDate || '미지정';
    const safeName = cn.replace(/&/g,'&amp;').replace(/</g,'&lt;');
    html += '<label style="display:flex; align-items:center; gap:10px; padding:8px 10px; border-bottom:1px solid #f1f5f9; cursor:pointer;">'
      + '<input type="checkbox" class="bulkOrderChk" data-oid="' + o.id + '" onchange="_updateBulkSelCount()">'
      + '<span style="flex:1;"><b>' + o.orderNo + '</b> · ' + safeName + '</span>'
      + '<small style="color:var(--muted);">현재: ' + dd + '</small>'
      + '</label>';
  });
  box.innerHTML = html;
}

window._bulkToggleAll = function(checked) {
  document.querySelectorAll('.bulkOrderChk').forEach(chk => { chk.checked = !!checked; });
  _updateBulkSelCount();
};

window._updateBulkSelCount = function() {
  const cnt = document.querySelectorAll('.bulkOrderChk:checked').length;
  const el = document.getElementById('bulkSelCount');
  if (el) el.textContent = cnt + ' 건 선택됨';
};

window.saveBulkDelivery = function() {
  const checks = document.querySelectorAll('.bulkOrderChk:checked');
  const newDate = document.getElementById('bulkNewDate').value;
  if (checks.length === 0) { alert('변경할 주문을 하나 이상 선택하세요.'); return; }
  if (!newDate) { alert('새 배송일을 지정하세요.'); return; }
  if (!confirm('선택한 ' + checks.length + '건의 배송일을 ' + newDate + ' 로 변경합니다.\n계속?')) return;
  let ok = 0;
  checks.forEach(chk => {
    const oid = chk.getAttribute('data-oid');
    const o = DB.orders.find(x => x.id === oid);
    if (!o) return;
    o.deliveryDate = newDate;
    try { saveEntityField('orders', oid, 'deliveryDate'); ok++; } catch(e) { console.warn('배송일 저장 실패:', oid, e); }
  });
  try { saveLocalDB(); } catch(_){}
  if (typeof showToast === 'function') showToast('📅 배송일 ' + ok + '건 변경 완료 → ' + newDate);
  closeBulkDeliveryChange();
  renderWarehouseList();
};

function renderWarehouseList() {
  const paletteEl = document.getElementById('whPaletteBar');
  const listEl = document.getElementById('whList');
  if (!paletteEl || !listEl) return;

  const _custNameOf = function(o) {
    const c = (DB.customers||[]).find(x => x.id === o.customerId);
    return (c && c.name) || '';
  };
  const pending = (DB.orders||[]).filter(o => o.status === 'new' || o.status === 'weighing')
    .sort((a,b) => _custNameOf(a).localeCompare(_custNameOf(b), 'ko-KR'));

  // ⭐ 팔레트 (상단): 지우개 + 5색 + 필터 토글
  const activeC = window._whActiveColor;
  const filterOn = window._whFilterOn;
  const filterColor = activeC || null;   // 필터는 활성 색 기준
  const btnStyle = (isActive, bg, border) =>
    'display:inline-flex; align-items:center; justify-content:center; gap:6px; ' +
    'padding:10px 14px; border-radius:20px; cursor:pointer; user-select:none; ' +
    'font-size:13px; font-weight:700; margin-right:6px; margin-bottom:6px; ' +
    'background:' + bg + '; border:' + (isActive ? '3px solid ' + border : '2px solid transparent') + ';' +
    (isActive ? 'box-shadow:0 2px 8px rgba(0,0,0,0.15);' : '');
  let paletteHtml = '<div style="margin-bottom:14px; padding:10px 12px; background:#FAF6F1; border-radius:10px;">';
  paletteHtml += '<div style="font-size:12px; color:var(--muted); margin-bottom:6px;">🎨 색상 선택 후 아래 거래처를 터치하세요</div>';
  paletteHtml += '<div style="display:flex; flex-wrap:wrap; align-items:center;">';
  // 지우개
  paletteHtml += '<span onclick="whPickColor(null)" style="' + btnStyle(activeC === null, '#F5F5F5', '#9E9E9E') + '">🧽 지우개</span>';
  // 5색
  Object.keys(WH_COLORS).forEach(function(k){
    const c = WH_COLORS[k];
    paletteHtml += '<span onclick="whPickColor(\'' + k + '\')" style="' + btnStyle(activeC === k, c.bg, c.dot) + '">'
      + '<span style="width:12px; height:12px; border-radius:50%; background:' + c.dot + ';"></span>'
      + c.label + '</span>';
  });
  // 필터 토글 (활성 색상이 있을 때만 의미 있음)
  const canFilter = !!activeC;
  const filterBtnBg = filterOn ? WH_COLORS[activeC].bg : '#fff';
  const filterBtnBorder = filterOn ? WH_COLORS[activeC].dot : '#BDBDBD';
  paletteHtml += '<span style="margin-left:auto;"></span>';
  paletteHtml += '<span onclick="' + (canFilter ? 'whToggleFilter()' : 'alert(\'먼저 상단에서 색상을 선택하세요.\')') + '" '
    + 'style="display:inline-flex; align-items:center; gap:6px; padding:10px 14px; border-radius:20px; cursor:pointer; user-select:none; font-size:13px; font-weight:700; '
    + 'background:' + filterBtnBg + '; border:2px solid ' + filterBtnBorder + '; ' + (canFilter ? '' : 'opacity:0.5;') + '">'
    + '🔎 ' + (filterOn && activeC ? WH_COLORS[activeC].label + '만 보기 ✓' : '이 색만 보기') + '</span>';
  paletteHtml += '</div></div>';
  paletteEl.innerHTML = paletteHtml;

  // ⭐ 리스트 (필터 적용)
  const filtered = (filterOn && filterColor) ? pending.filter(o => o.assignedColor === filterColor) : pending;
  let listHtml = '<h3 style="margin-bottom:8px;">대기 주문 (' + filtered.length
    + (filterOn && filterColor ? ' / 전체 ' + pending.length : '') + '건)</h3>';
  if (filtered.length === 0) {
    listHtml += '<div class="empty"><div class="icon">✅</div>'
      + (filterOn && filterColor ? WH_COLORS[filterColor].label + ' 색상 배정된 주문이 없습니다.' : '처리할 주문이 없습니다.')
      + '</div>';
    listEl.innerHTML = listHtml;
    return;
  }
  listHtml += '<table class="t"><thead><tr>'
    + '<th>주문번호</th><th>거래처</th><th>품목수</th><th>상태</th><th>주문일시</th><th>희망 배송일</th><th class="act"></th>'
    + '</tr></thead><tbody>';
  filtered.forEach(o => {
    const c = DB.customers.find(x => x.id === o.customerId);
    const clr = o.assignedColor && WH_COLORS[o.assignedColor] ? WH_COLORS[o.assignedColor] : null;
    const rowBg = clr ? 'background:' + clr.bg + ';' : '';
    const rowBorder = clr ? 'border-left:4px solid ' + clr.dot + ';' : '';
    // 행 전체 클릭 = 색상 지정 (계근 버튼·배송일 지정 버튼만 각자 액션)
    // ⭐ (2026-08-02) 배송일 미지정 주문에만 [📅 지정] 버튼 표시. 지정되면 자동으로 renderDeliveryBadge 로 전환.
    const deliveryCell = o.deliveryDate
      ? renderDeliveryBadge(o.deliveryDate)
      : '<button class="btn sm" style="background:#E68A00; color:#fff; padding:4px 10px; font-size:12px;" onclick="event.stopPropagation(); whSetDeliveryDate(\'' + o.id + '\')">📅 지정</button>';
    listHtml += '<tr style="cursor:pointer;' + rowBg + rowBorder + '" onclick="whAssignColor(\'' + o.id + '\')">'
      + '<td><b>' + o.orderNo + '</b></td>'
      + '<td>' + (c ? c.name : '-') + '</td>'
      + '<td>' + o.items.length + '</td>'
      + '<td><span class="pill ' + o.status + '">' + statusLabel(o.status) + '</span></td>'
      + '<td>' + new Date(o.orderDate).toLocaleString('ko-KR') + '</td>'
      + '<td>' + deliveryCell + '</td>'
      + '<td class="act"><button class="btn sm" onclick="event.stopPropagation(); location.hash=\'#weigh?id=' + o.id + '\'">계근하기 →</button></td>'
      + '</tr>';
  });
  listHtml += '</tbody></table>';
  listEl.innerHTML = listHtml;
}

        <button class="btn success" onclick="completeWeighing('${order.id}')">✅ 계근 완료 → 사무실로 전송</button>
        <button class="btn secondary" onclick="location.hash='#warehouse'">목록으로</button>
      </div>

  renderWeighingTotal(order);
}
function completeWeighing(orderId) {
  const o = DB.orders.find(x => x.id === orderId);
  const missing = o.items.filter(i => i.actualWeightKg == null || i.actualWeightKg <= 0);
  if (missing.length > 0) {
    if (!confirm(`${missing.length}개 품목의 중량이 미입력입니다. 그래도 진행할까요?`)) return;
  }
  o.status = 'weighed';
  o.weighedAt = new Date().toISOString();
  // Phase 2 동시성: 다른 주문 작업과 충돌 없이 status+weighedAt 동시 업데이트
  saveEntityFields('orders', orderId, { status: o.status, weighedAt: o.weighedAt });
  alert('계근 완료! 사무실로 전송되었습니다.');
  location.hash = '#warehouse';
}

function updateWeighing(orderId, idx, val) {
  const o = DB.orders.find(x => x.id === orderId);
  const v = parseFloat(val);
  o.items[idx].actualWeightKg = (isNaN(v) || v <= 0) ? null : v;
  // Phase 1 동시성: 전체 DB 덮어쓰지 않고 이 항목만 부분 업데이트
  saveOrderItemField(orderId, 'items', idx, 'actualWeightKg');
  renderWeighingTotal(o);
}

// ⭐ (2026-07-07) 창고↔사무실 메모 저장. 인보이스에는 절대 노출되지 않음 (invoice/PDF 렌더가 참조 X).
function updateWarehouseMemo(orderId, idx, val) {
  const o = DB.orders.find(x => x.id === orderId);
  if (!o || !o.items || !o.items[idx]) return;
  o.items[idx].warehouseMemo = (val || '').trim();
  saveOrderItemField(orderId, 'items', idx, 'warehouseMemo');
}
window.updateWarehouseMemo = updateWarehouseMemo;
function renderWeighingTotal(o) {
  let total = 0, weighed = 0;
  o.items.forEach(it => {
    if (it.actualWeightKg != null && it.actualWeightKg > 0) {
      total += it.actualWeightKg;
      weighed++;
    }
  });
  const tEl = document.getElementById('totalWeighedKg');
  const pEl = document.getElementById('weighProgress');
  if (tEl) tEl.textContent = total.toFixed(2);
  if (pEl) pEl.textContent = weighed + '/' + o.items.length;
}

// ⭐ (2026-07-07) 사무실 페이지 백업 경고 배너
//   조건: toLocalISODate(lastFullBackupAt) < 어제(로컬) AND 오늘 dismiss 안 함
function renderOfficeBackupBanner() {
  try {
    const dismissKey = 'atm_backup_dismiss';
    const dismissDate = localStorage.getItem(dismissKey);
    if (dismissDate === todayLocalISO()) return '';   // 오늘 이미 닫음
    const last = (DB.settings && DB.settings.lastFullBackupAt) || '';
    if (!last) return '';
    const lastDate = toLocalISODate(last);
    if (!lastDate) return '';
    // 어제 로컬 날짜 계산
    const y = new Date();
    y.setDate(y.getDate() - 1);
    const yesterdayISO = y.getFullYear() + '-' + String(y.getMonth()+1).padStart(2,'0') + '-' + String(y.getDate()).padStart(2,'0');
    // lastDate < 어제 → 어제도 백업 없음 → 배너
    if (lastDate >= yesterdayISO) return '';
    // 며칠 전인지 계산
    const nowD  = new Date(); nowD.setHours(0,0,0,0);
    const lastD = new Date(lastDate + 'T00:00:00');
    const daysAgo = Math.max(1, Math.round((nowD.getTime() - lastD.getTime()) / (24*60*60*1000)));
    return `
      <style id="atmBackupBannerAnim">
        @keyframes atmBackupPulse {
          0%,100% { background:#FFF7E0; box-shadow:0 0 0 0 rgba(184,134,11,0); }
          50%     { background:#FFEBB5; box-shadow:0 0 0 4px rgba(184,134,11,0.15); }
        }
      </style>
      <div id="atmBackupBanner" style="margin:0 0 12px 0; padding:12px 16px; background:#FFF7E0; border:2px solid #B8860B; border-radius:8px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; animation: atmBackupPulse 2s ease-in-out infinite;">
        <div style="flex:1; font-size:13px; color:#5C3A00;">
          💡 <b>전체 백업 권장</b> — 마지막 백업: ${lastDate} (${daysAgo}일 전)
        </div>
        <button class="btn sm success" style="font-size:12px;" onclick="triggerFullBackupNow()">💾 지금 백업</button>
        <button class="btn sm secondary" style="font-size:12px;" onclick="dismissBackupBannerToday()">오늘 그만 보기</button>
      </div>
    `;
  } catch(e) {
    console.warn('renderOfficeBackupBanner error:', e);
    return '';
  }
}

//   기본 30일, 체크박스 전환 시 전체 표시.
window.renderPaymentHistoryList = function(cid) {
  const box = document.getElementById('paymentHistoryList');
  if (!box) return;
  if (!cid) {
    box.innerHTML = '<div style="color:var(--muted); font-size:11px; padding:6px 2px;">거래처를 선택하면 최근 입금 목록이 표시됩니다.</div>';
    return;
  }
  const showAll = !!(document.getElementById('ipHistShowAll') && document.getElementById('ipHistShowAll').checked);
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - 30);
  const cutoffISO = cutoff.getFullYear() + '-' + String(cutoff.getMonth()+1).padStart(2,'0') + '-' + String(cutoff.getDate()).padStart(2,'0');
  const payments = (DB.payments || [])
    .filter(p => p && p.customerId === cid)
    .filter(p => showAll ? true : (p.date >= cutoffISO))
    .sort((a,b) => (a.date < b.date ? 1 : -1));  // 최신순
  if (payments.length === 0) {
    box.innerHTML = '<div style="color:var(--muted); font-size:11px; padding:6px 2px;">' + (showAll ? '해당 거래처 입금 이력 없음' : '최근 30일 내 입금 없음 · [전체 보기]로 과거 확인') + '</div>';
    return;
  }
  const methodLbl = { cash:'현금', cheque:'체크', bank:'은행이체' };
  let html = '<table class="t" style="font-size:12px;">'
    + '<thead><tr>'
    + '<th>날짜</th><th class="num">금액</th><th>방법</th><th>참조</th><th>메모</th><th class="act"></th>'
    + '</tr></thead><tbody>';
  payments.forEach(p => {
    const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    html += '<tr>'
      + '<td>' + esc(p.date) + '</td>'
      + '<td class="num" style="font-weight:600;">$' + fmtMoney(p.amount) + '</td>'
      + '<td>' + (methodLbl[p.method] || esc(p.method)) + '</td>'
      + '<td><small style="color:var(--muted);">' + esc(p.reference || '—') + '</small></td>'
      + '<td><small style="color:var(--muted);">' + esc(p.notes || '') + '</small></td>'
      + '<td class="act"><button class="btn sm danger" style="padding:2px 8px; font-size:11px;" onclick="deletePayment(\'' + p.id + '\')">🗑 삭제</button></td>'
      + '</tr>';
  });
  html += '</tbody></table>';
  box.innerHTML = html;
};

// ⭐ (2026-07-07) 입금 삭제 — 확인 후 DB.payments에서 제거 + Firebase 부분 삭제.
//   삭제 시점에 최신 인덱스로 재검사 (다른 기기 동시 수정 방어).
window.deletePayment = function(payId) {
  if (!payId) return;
  const idx = (DB.payments || []).findIndex(p => p && p.id === payId);
  if (idx < 0) { alert('해당 입금을 찾을 수 없습니다. (이미 삭제됐을 수 있습니다)'); return; }
  const p = DB.payments[idx];
  const cust = DB.customers.find(c => c.id === p.customerId);
  const custName = cust ? cust.name : '(거래처 불명)';
  const dateStr = p.date || '';
  const amtStr = fmtMoney(p.amount || 0);
  if (!confirm('입금 기록 삭제:\n\n' + custName + '\n' + dateStr + ' $' + amtStr + '\n\n되돌릴 수 없습니다. 계속할까요?')) return;

  // 저장 시점 재검사 — 인덱스가 이동했을 수 있음
  const idxNow = DB.payments.findIndex(x => x && x.id === payId);
  if (idxNow < 0) { alert('삭제 대상이 사라졌습니다. 새로고침 후 다시 시도해주세요.'); return; }

  // 로컬 제거
  DB.payments.splice(idxNow, 1);
  try { saveLocalDB(); } catch(e){}

  // 🛡️ (2026-07-30) 동시성 안전 — 서버에서 payment ID 로 삭제 (전체 재기록 X)
  //   기존: DB_REF.child('payments').set(DB.payments) → 다른 매니저의 삭제 덮어씀
  //   신규: transaction 으로 ID 로 찾아 제거 → 다른 삭제와 충돌 없음
  if (typeof DB_REF !== 'undefined' && DB_REF) {
    _lastSaveTime = Date.now();
    DB_REF.child('payments').transaction(function(currentList) {
      if (!currentList) return currentList;
      // Firebase 는 sparse array 를 object 로 반환 — 둘 다 처리
      if (Array.isArray(currentList)) {
        return currentList.filter(function(x) { return x && x.id !== payId; });
      }
      var result = {};
      Object.keys(currentList).forEach(function(k) {
        if (currentList[k] && currentList[k].id !== payId) result[k] = currentList[k];
      });
      return result;
    }, function(error) {
      if (error) console.warn('payments delete transaction 실패:', error);
    });
  }

  showToast('🗑 입금 기록 삭제 완료 (' + custName + ' · $' + amtStr + ')');

  // UI 재렌더링: 이력 목록 + 매출일보 표
  renderPaymentHistoryList(p.customerId);
  if (typeof renderDailyReport === 'function') renderDailyReport();
};

// 🔧 시간대 헬퍼 — toISOString()은 UTC 기준이라 시드니 야간/새벽엔 날짜가 하루 어긋남.
// 모든 "오늘" 비교는 로컬 시간 기준으로 통일해야 배송완료 직후 매출일보에 즉시 반영됨.
function todayLocalISO() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function toLocalISODate(input) {
  if (!input) return '';
  const s = String(input);
  // 이미 YYYY-MM-DD 형식이면 그대로
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const d = new Date(s);
  if (isNaN(d.getTime())) return s.slice(0,10);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function formatDateDMY(iso) {
  if (!iso) return '-';
  const d = new Date(iso + 'T00:00:00');
  if (isNaN(d.getTime())) return iso;
  return d.toLocaleDateString('en-GB', { day:'2-digit', month:'2-digit', year:'numeric' });
}

// ⭐ (2026-08-02) 배송일 계산 헬퍼 — 주말·휴무 자동 스킵
//   휴무 데이터: DB.company.holidays = [{start:'YYYY-MM-DD', end:'YYYY-MM-DD'}, ...]
function getHolidayRanges() {
  if (!DB || !DB.company) return [];
  const arr = DB.company.holidays;
  if (!Array.isArray(arr)) return [];
  return arr.filter(h => h && h.start && h.end && h.start <= h.end);
}
// dateISO(YYYY-MM-DD) 가 휴무 기간 내인가?
function isHolidayDate(dateISO) {
  if (!dateISO) return false;
  return getHolidayRanges().some(h => dateISO >= h.start && dateISO <= h.end);
}
// dateISO 가 영업일인가? (평일 && 휴무 아님)
function isBusinessDay(dateISO) {
  if (!dateISO) return false;
  const d = new Date(dateISO + 'T12:00:00');
  const dow = d.getDay();
  if (dow === 0 || dow === 6) return false;
  if (isHolidayDate(dateISO)) return false;
  return true;
}
// dateISO 부터 시작해 첫 영업일 (자체가 영업일이면 그대로 반환)
function getFirstBusinessDayOnOrAfter(dateISO) {
  let d = new Date(dateISO + 'T12:00:00');
  for (let i = 0; i < 400; i++) {   // 안전장치 (400일)
    const iso = toLocalISODate(d);
    if (isBusinessDay(iso)) return iso;
    d.setDate(d.getDate() + 1);
  }
  return dateISO;   // 안전 폴백
}
// 오늘 이후 다가올 휴무 기간 리스트 (배송일 선택 모달용)
function upcomingHolidayRanges() {
  const today = todayLocalISO();
  return getHolidayRanges()
    .filter(h => h.end >= today)   // 끝나지 않은 것만
    .sort((a, b) => a.start.localeCompare(b.start));
}
// "M월 D일" 형식
function formatDateShort(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  if (isNaN(d.getTime())) return iso;
  return (d.getMonth()+1) + '월 ' + d.getDate() + '일';
}

function dailyReportComputeRows(dateISO) {
  const custs = DB.customers.filter(c => c.active !== false);
  const todayCutoff = new Date(dateISO + 'T00:00:00');
  const rows = custs.map(c => {
    const days = termsDays(c.terms);
    // 매출일보는 '배송완료(delivered)' 주문만 집계 — 배송완료 시점 자동 반영
    // 날짜는 deliveredAt 우선 → invoicedAt → orderDate 순으로 폴백
    // ⚠️ toLocalISODate() 사용 — UTC ISO를 로컬 날짜로 변환해야 시드니 시각 기준으로 매칭됨
    // ⭐ (2026-08-05) 크레딧은 인보이스 라인 아이템으로 반영되므로 amount 는 net 사용.
    const allInvoices = DB.orders
      .filter(o => o.status === 'delivered' && o.customerId === c.id)
      .map(o => ({
        dateISO: toLocalISODate(o.deliveredAt || o.invoicedAt || o.orderDate || ''),
        amount: computeTotalsWithCredits(o).net
      }))
      .filter(x => x.dateISO);
    const allPayments = (DB.payments||[]).filter(p => p.customerId === c.id);

    // ⭐ (2026-08-05) 크레딧 별도 차감 로직 제거 — net 인보이스 금액에 이미 반영됨.
    const todayCredit = 0;   // 하위 호환 표시용 (return 객체)

    // 전미수금 = 선택일 이전(<)까지의 net 인보이스 - 입금
    const priorInvoiced = allInvoices.filter(x => x.dateISO < dateISO).reduce((s,x)=>s+x.amount,0);
    const priorPaid = allPayments.filter(p => (p.date||'') < dateISO).reduce((s,p)=>s+p.amount,0);
    const priorBalance = priorInvoiced - priorPaid;

    // 당일 매출액 / 입금액 — net 그대로 사용
    const todaySales = allInvoices.filter(x => x.dateISO === dateISO).reduce((s,x)=>s+x.amount,0);
    const todayPaid = allPayments.filter(p => (p.date||'') === dateISO).reduce((s,p)=>s+p.amount,0);

    // 현잔액 = 전미수금 + 당일 매출 - 당일 입금
    const currentBalance = priorBalance + todaySales - todayPaid;

    // ⭐ (2026-08-06) Overdue 2단계 정책:
    //   경고 (WARN): 결제조건 + 7일 초과
    //   심각 (SEVERE): 결제조건 + 14일 초과
    //   현금/계좌이체(termsDays=0): 계산 제외
    //   또한 심각 거래처의 세부 인보이스 리스트도 반환 (매출일보 상세 뷰용)
    const WARN_GRACE = 7;
    const SEVERE_GRACE = 14;
    let overdue = 0;         // 경고+심각 합계 (하위 호환)
    let overdueMild = 0;     // 경고만
    let overdueSevere = 0;   // 심각만
    const overdueInvoices = [];   // [{orderId, invNo, dateISO, unpaid, delayDays, status:'mild'|'severe'}]
    if (days > 0) {
      const invoicesAsOf = DB.orders
        .filter(o => o.status === 'delivered' && o.customerId === c.id)
        .map(o => ({
          orderId: o.id,
          invNo: o.invoiceNo || o.orderNo || '-',
          dateISO: toLocalISODate(o.deliveredAt || o.invoicedAt || o.orderDate || ''),
          amount: computeTotalsWithCredits(o).net
        }))
        .filter(x => x.dateISO && x.dateISO <= dateISO)
        .sort((a,b) => a.dateISO.localeCompare(b.dateISO));
      let totalPaymentAsOf = allPayments
        .filter(p => (p.date||'') <= dateISO)
        .reduce((s,p)=>s+p.amount,0);
      for (const inv of invoicesAsOf) {
        let unpaid = inv.amount;
        if (unpaid < 0) unpaid = 0;
        if (totalPaymentAsOf > 0 && unpaid > 0) {
          const applied = Math.min(totalPaymentAsOf, unpaid);
          unpaid -= applied;
          totalPaymentAsOf -= applied;
        }
        if (unpaid > 0.001) {
          const invDate = new Date(inv.dateISO + 'T00:00:00');
          const dueDate = new Date(invDate.getTime());
          dueDate.setDate(dueDate.getDate() + days);   // 결제 기한
          const delayMs = todayCutoff.getTime() - dueDate.getTime();
          const delayDays = Math.floor(delayMs / (86400000));
          if (delayDays >= SEVERE_GRACE) {
            overdueSevere += unpaid;
            overdue += unpaid;
            overdueInvoices.push({ orderId:inv.orderId, invNo:inv.invNo, dateISO:inv.dateISO, unpaid:unpaid, delayDays:delayDays, status:'severe' });
          } else if (delayDays >= WARN_GRACE) {
            overdueMild += unpaid;
            overdue += unpaid;
            overdueInvoices.push({ orderId:inv.orderId, invNo:inv.invNo, dateISO:inv.dateISO, unpaid:unpaid, delayDays:delayDays, status:'mild' });
          }
        }
      }
    }
    return { c, priorBalance, todaySales, todayPaid, currentBalance, overdue, overdueMild, overdueSevere, overdueInvoices, todayCredit };
  });
  // ⭐ (2026-07-25) 정렬 방식 사용자 선택 — 매출일보/스테이트먼트 상단 드롭다운.
  //   기본값 'alpha' (알파벳순). 화면 진입할 때마다 초기화 (마지막 선택 기억 X).
  const mode = (window._salesSortMode || 'alpha');
  if (mode === 'balance') {
    rows.sort((a,b) => (b.currentBalance - a.currentBalance) || a.c.name.localeCompare(b.c.name, 'en'));
  } else if (mode === 'overdue') {
    rows.sort((a,b) => (b.overdue - a.overdue) || (b.currentBalance - a.currentBalance) || a.c.name.localeCompare(b.c.name, 'en'));
  } else if (mode === 'severe') {
    // ⭐ (2026-08-06) 심각순 — 심각 있는 거래처만 (필터). 심각 큰순 → 경고 큰순 → 이름순.
    rows = rows.filter(r => (r.overdueSevere||0) > 0.001);
    rows.sort((a,b) =>
      (b.overdueSevere - a.overdueSevere) ||
      (b.overdueMild - a.overdueMild) ||
      (a.c.name||'').localeCompare(b.c.name||'', 'en')
    );
  } else {
    // alpha: 알파벳 순 (기본)
    rows.sort((a,b) => (a.c.name||'').localeCompare(b.c.name||'', 'en'));
  }
  return rows;
}

function dailyReportTotals(rows) {
  return rows.reduce((t, r) => ({
    priorBalance: t.priorBalance + r.priorBalance,
    todaySales: t.todaySales + r.todaySales,
    todayPaid: t.todayPaid + r.todayPaid,
    currentBalance: t.currentBalance + r.currentBalance,
    overdue: t.overdue + r.overdue,
    overdueMild: (t.overdueMild||0) + (r.overdueMild||0),
    overdueSevere: (t.overdueSevere||0) + (r.overdueSevere||0),
  }), {priorBalance:0, todaySales:0, todayPaid:0, currentBalance:0, overdue:0, overdueMild:0, overdueSevere:0});
}

// ⭐ (2026-08-06) Overdue 컬럼 셀 렌더 — 심각 우선 색상, 단일 값
function _overdueCellHTML(r, isTotal) {
  const sev = r.overdueSevere || 0;
  const mild = r.overdueMild || 0;
  if (sev > 0.001) {
    return '<td class="num" style="font-weight:700; color:#D32F2F;' + (isTotal?'font-size:14px;':'') + '">🔴 $' + fmtMoney(sev) + '</td>';
  }
  if (mild > 0.001) {
    return '<td class="num" style="font-weight:700; color:#E8A317;' + (isTotal?'font-size:14px;':'') + '">🟡 $' + fmtMoney(mild) + '</td>';
  }
  return '<td class="num" style="color:var(--muted);' + (isTotal?'font-weight:700;font-size:14px;':'') + '">–</td>';

function _dailyReportSevereDetailHTML(rows) {

  const grand = rows.reduce((s,r) => ({ sev: s.sev + (r.overdueSevere||0), mild: s.mild + (r.overdueMild||0) }), { sev:0, mild:0 });
  const invCount = rows.reduce((s,r) => s + (r.overdueInvoices||[]).length, 0);
  const sevInvCount = rows.reduce((s,r) => s + (r.overdueInvoices||[]).filter(x=>x.status==='severe').length, 0);
  const mildInvCount = invCount - sevInvCount;
  let html = '<div class="card" style="background:#FDECEA; border-left:4px solid #D32F2F; margin-bottom:14px;">'
    + '<h3 style="margin:0; color:#D32F2F;">🔴 심각 Overdue 거래처 상세 (' + rows.length + '개 업체 · ' + sevInvCount + ' 건 심각 · ' + mildInvCount + ' 건 경고)</h3>'
    + '<div style="font-size:12px; color:var(--muted); margin-top:4px;">기준: 결제조건 + 7일 → 경고 · + 14일 → 심각</div>'
    + '</div>';
  html += '<table class="t"><thead><tr>'
    + '<th>거래처</th><th>결제조건</th><th class="num">심각 합계</th><th class="num">경고 합계</th>'
    + '<th class="num">현잔액</th>'
    + '</tr></thead><tbody>';
  html += '<tr style="background:#FBF8F4; border-bottom:2px solid var(--brand);"><td colspan="2" style="font-weight:800; color:var(--brand);">📊 합계 (' + rows.length + '건)</td>'
    + '<td class="num" style="font-weight:800; color:#D32F2F; font-size:14px;">🔴 $' + fmtMoney(grand.sev) + '</td>'
    + '<td class="num" style="font-weight:800; color:#E8A317; font-size:14px;">🟡 $' + fmtMoney(grand.mild) + '</td>'
    + '<td class="num">–</td></tr>';
  rows.forEach(function(r){
    const balColor = r.currentBalance > 0 ? 'var(--warn)' : (r.currentBalance < -0.001 ? 'var(--success)' : '#2A1A1A');
    html += '<tr>'
      + '<td><b><a href="#statement?cid=' + r.c.id + '" style="color:var(--brand-dark); text-decoration:none;">' + escapeHtmlSimple(r.c.name) + '</a></b>' + (r.c.contact ? '<br><small style="color:var(--muted);">' + escapeHtmlSimple(r.c.contact) + '</small>' : '') + '</td>'
      + '<td><small style="color:var(--muted);">' + termsLabel(r.c.terms) + '</small></td>'
      + '<td class="num" style="font-weight:700; color:#D32F2F;">🔴 $' + fmtMoney(r.overdueSevere||0) + '</td>'
      + '<td class="num" style="font-weight:700; color:' + ((r.overdueMild||0)>0.001?'#E8A317':'var(--muted)') + ';">' + ((r.overdueMild||0)>0.001 ? '🟡 $' + fmtMoney(r.overdueMild) : '–') + '</td>'
      + '<td class="num" style="font-weight:700; color:' + balColor + ';">$' + fmtMoney(r.currentBalance) + '</td>'
      + '</tr>';
  });
  html += '</tbody></table>';
  return html;
}

function saveDailySalesSnapshot(dateISO, rows) {
  try {

    const totals = dailyReportTotals(rows);
    log[dateISO] = {
      date: dateISO,
      savedAt: new Date().toISOString(),
      totals,
      rows: rows.map(r => ({
        custId: r.c.id,
        custName: r.c.name,
        terms: r.c.terms,

        todaySales: r.todaySales,
        todayPaid: r.todayPaid,
        currentBalance: r.currentBalance,
        overdue: r.overdue,
      })),
    };
    localStorage.setItem(key, JSON.stringify(log));
  } catch (e) { console.warn('일보 스냅샷 저장 실패', e); }
}

let _dailyReportDirHandle = null;

async function getDailyReportDirHandle() {
  // ⭐ (2026-08-11) 통합 폴더 우선 — master/매출일보/YYYY-MM/에 저장
  const sub = await getMasterSubDir('매출일보');
  if (sub) return sub;
  // legacy fallback
  if (_dailyReportDirHandle) {
    try {
      const perm = await _dailyReportDirHandle.queryPermission({ mode: 'readwrite' });
      if (perm === 'granted') return _dailyReportDirHandle;
      const req = await _dailyReportDirHandle.requestPermission({ mode: 'readwrite' });
      if (req === 'granted') return _dailyReportDirHandle;
    } catch(e) {}
  }
  try {
    const handle = await idbGet('dailyReportDirHandle');
    if (handle) {
      let perm = await handle.queryPermission({ mode: 'readwrite' });
      if (perm !== 'granted') perm = await handle.requestPermission({ mode: 'readwrite' });
      if (perm === 'granted') { _dailyReportDirHandle = handle; return handle; }
    }
  } catch(e) {}
  return null;
}

  document.body.appendChild(container);

  try {
    await new Promise(r => setTimeout(r, 120));
    const canvas = await html2canvas(container.firstElementChild, {
      scale: 2, useCORS: true, backgroundColor: '#ffffff', logging: false
    });
    const imgData = canvas.toDataURL('image/jpeg', 0.95);
    const { jsPDF } = window.jspdf;
    const pageW = 210, pageH = 297;
    const imgH = canvas.height * pageW / canvas.width;
    const doc = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
    if (imgH <= pageH) {
      doc.addImage(imgData, 'JPEG', 0, 0, pageW, imgH);
    } else {
      let yOff = 0;
      while (yOff < imgH) {
        if (yOff > 0) doc.addPage();
        doc.addImage(imgData, 'JPEG', 0, -yOff, pageW, imgH);
        yOff += pageH;
      }
    }

    const yearMonth = dateISO.slice(0,7);
    const filename = `ATM_매출일보_${dateISO}.pdf`;

    if (dirHandle) {
      try {
        const buf = doc.output('arraybuffer');
        await writeToFolderPath(dirHandle, [yearMonth], filename, buf);
        if (typeof showToast === 'function') showToast(`✅ 매출일보 저장 완료 — 📁 ${dirHandle.name}/${yearMonth}/${filename}`);
      } catch(e) {
        console.warn('폴더 저장 실패, 다운로드 대체:', e);
        doc.save(filename);
        if (typeof showToast === 'function') showToast(`💾 매출일보 다운로드 완료 (폴더 쓰기 실패)`);
      }
    } else {
      doc.save(filename);
      setTimeout(() => alert('💾 매출일보 다운로드 완료!\n\n📁 매번 같은 폴더에 자동 저장하려면\n"📁 폴더 변경" 버튼을 한 번 눌러서\n저장 폴더를 지정해 주세요.\n\n이후부터는 클릭만 하면\n자동으로 그 폴더에 "년-월" 하위폴더가 만들어지고\n그 안에 PDF가 저장됩니다.'), 300);
    }
  } catch(e) {
    console.error('매출일보 PDF 저장 실패:', e);
    alert('PDF 저장 실패: ' + e.message);
  } finally {
    document.body.removeChild(container);
  }
};
// ============================================================================
// ⭐ (2026-07-08) 입금 금액 → 거래처/인보이스 자동 매칭
// ----------------------------------------------------------------------------
// 트리거: ipAmount input → 500ms debounce → 검색
// 우선순위 (근사치 없음):
//   1) 정확 일치: 인보이스 순미결제액 === 입금액
//   2) 부분납: 인보이스 순미결제액 > 입금액
//   3) 다건 합산: 같은 거래처 여러 인보이스 합계 === 입금액 (최대 3건)
// ============================================================================
let _paymentMatchTimer = null;
window.schedulePaymentMatchSearch = function(val) {
  if (_paymentMatchTimer) clearTimeout(_paymentMatchTimer);
  _paymentMatchTimer = setTimeout(() => renderPaymentMatches(val), 500);
};

// 특정 거래처의 배송완료 인보이스별 순미결제액 계산 (FIFO 반영)
// ⭐ (2026-08-05) 크레딧은 net 인보이스 금액에 이미 반영됨 (computeTotalsWithCredits).
function _computeUnpaidByInvoice(cid) {
  const invoices = DB.orders
    .filter(o => o.status === 'delivered' && o.customerId === cid)
    .map(o => ({
      id: o.id,
      invNo: o.invoiceNo || o.orderNo || '-',
      dateISO: toLocalISODate(o.deliveredAt || o.invoicedAt || o.orderDate || ''),
      net: computeTotalsWithCredits(o).net
    }))
    .filter(x => x.dateISO)
    .sort((a,b) => a.dateISO.localeCompare(b.dateISO));

  // FIFO 입금 배분
  let pool = (DB.payments || [])
    .filter(p => p && p.customerId === cid)
    .reduce((s,p) => s + p.amount, 0);
  const result = [];
  for (const inv of invoices) {
    const net = Math.max(0, inv.net);
    const applied = Math.min(pool, net);
    pool -= applied;
    const unpaid = net - applied;
    if (unpaid > 0.001) {
      result.push({ orderId: inv.id, invNo: inv.invNo, dateISO: inv.dateISO, unpaid: unpaid });
    }
  }
  return result;
}

window.renderPaymentMatches = function(inputVal) {
  const box = document.getElementById('paymentMatchBox');
  if (!box) return;
  const amt = parseFloat(inputVal);
  if (!amt || amt <= 0) { box.innerHTML = ''; return; }

  const EPS = 0.005; // 소수점 반올림용
  const exactMatches = [];   // { cid, invNo, orderId, dateISO, unpaid }
  const partialMatches = []; // 부분납 후보 (미결제 > 입금액)
  const sumMatches = [];     // { cid, custName, invoices: [{invNo, unpaid}], total }

  DB.customers.filter(c => c.active !== false).forEach(c => {
    const list = _computeUnpaidByInvoice(c.id);
    if (list.length === 0) return;

    // 1) 정확 일치
    list.forEach(inv => {
      if (Math.abs(inv.unpaid - amt) < EPS) {
        exactMatches.push({ cid: c.id, custName: c.name, ...inv });
      } else if (inv.unpaid > amt + EPS) {
        partialMatches.push({ cid: c.id, custName: c.name, ...inv });
      }
    });

    // 3) 다건 합산 (같은 거래처 최대 3건)
    if (list.length >= 2) {
      for (let i = 0; i < list.length && i < 5; i++) {
        for (let j = i + 1; j < list.length && j < 5; j++) {
          if (Math.abs(list[i].unpaid + list[j].unpaid - amt) < EPS) {
            sumMatches.push({ cid: c.id, custName: c.name, invoices: [list[i], list[j]], total: list[i].unpaid + list[j].unpaid });
            continue;
          }
          for (let k = j + 1; k < list.length && k < 5; k++) {
            if (Math.abs(list[i].unpaid + list[j].unpaid + list[k].unpaid - amt) < EPS) {
              sumMatches.push({ cid: c.id, custName: c.name, invoices: [list[i], list[j], list[k]], total: list[i].unpaid + list[j].unpaid + list[k].unpaid });
            }
          }
        }
      }
    }
  });

  // 부분납은 미결제 큰 순 상위 5개만
  partialMatches.sort((a,b) => b.unpaid - a.unpaid);
  const partialTop = partialMatches.slice(0, 5);

  const totalHits = exactMatches.length + partialTop.length + sumMatches.length;
  if (totalHits === 0) {
    box.innerHTML = '<div style="padding:8px 12px; background:#F8F8F8; border:1px dashed var(--line); border-radius:6px; font-size:12px; color:var(--muted);">🔍 $' + fmtMoney(amt) + ' 매칭 후보 없음 — 거래처를 직접 선택하세요.</div>';
    return;
  }

  const _mkExactRow = (m) => `<div style="padding:6px 10px; background:#E8F5E9; border-left:3px solid var(--ok); border-radius:4px; margin-bottom:4px; display:flex; justify-content:space-between; align-items:center; font-size:12px; cursor:pointer;" onclick="applyPaymentMatch('${m.cid}','${m.invNo}')">
    <div><b style="color:var(--brand-dark);">${m.custName}</b> · INV${m.invNo} · ${m.dateISO}</div>
    <div><b>$${fmtMoney(m.unpaid)}</b> <span style="color:var(--ok); font-size:10px;">정확</span> <span style="color:var(--brand); font-size:10px;">클릭 → 선택</span></div>
  </div>`;
  const _mkPartialRow = (m) => `<div style="padding:6px 10px; background:#FFF7E0; border-left:3px solid var(--warn); border-radius:4px; margin-bottom:4px; display:flex; justify-content:space-between; align-items:center; font-size:12px; cursor:pointer;" onclick="applyPaymentMatch('${m.cid}','${m.invNo}')">
    <div><b style="color:var(--brand-dark);">${m.custName}</b> · INV${m.invNo} · ${m.dateISO}</div>
    <div>미결 <b>$${fmtMoney(m.unpaid)}</b> <span style="color:var(--warn); font-size:10px;">부분납</span> <span style="color:var(--brand); font-size:10px;">클릭 → 선택</span></div>
  </div>`;
  const _mkSumRow = (m) => {
    const nos = m.invoices.map(x => 'INV' + x.invNo).join(' + ');
    const ref = m.invoices.map(x => x.invNo).join(',');
    return `<div style="padding:6px 10px; background:#EDE7F6; border-left:3px solid #5E35B1; border-radius:4px; margin-bottom:4px; display:flex; justify-content:space-between; align-items:center; font-size:12px; cursor:pointer;" onclick="applyPaymentMatch('${m.cid}','${ref}')">
      <div><b style="color:var(--brand-dark);">${m.custName}</b> · ${nos}</div>
      <div>합계 <b>$${fmtMoney(m.total)}</b> <span style="color:#5E35B1; font-size:10px;">${m.invoices.length}건 합산</span> <span style="color:var(--brand); font-size:10px;">클릭 → 선택</span></div>
    </div>`;
  };

  let html = '<div style="padding:8px 12px; background:#FAF6F1; border:1px solid var(--line); border-radius:6px;">';
  html += '<div style="font-size:11px; color:var(--muted); margin-bottom:6px;">🔍 <b>$' + fmtMoney(amt) + '</b> 매칭 후보 ' + totalHits + '건 — 클릭 시 거래처·참조번호 자동 채움</div>';
  if (exactMatches.length > 0) {
    html += '<div style="font-size:10px; color:var(--ok); font-weight:700; margin:4px 0 2px;">✓ 정확 일치</div>';
    exactMatches.forEach(m => html += _mkExactRow(m));
  }
  if (sumMatches.length > 0) {
    html += '<div style="font-size:10px; color:#5E35B1; font-weight:700; margin:4px 0 2px;">▲ 다건 합산</div>';
    sumMatches.forEach(m => html += _mkSumRow(m));
  }
  if (partialTop.length > 0) {
    html += '<div style="font-size:10px; color:var(--warn); font-weight:700; margin:4px 0 2px;">△ 부분납 후보 (미결제 큰 순 상위 5)</div>';
    partialTop.forEach(m => html += _mkPartialRow(m));
  }
  html += '</div>';
  box.innerHTML = html;
};

// =========================================================================
// ⭐ (2026-08-11) 은행 CSV 입금 일괄 등록 — ANZ / Suncorp
//   매출일보 → [💳 입금/수정] 패널 → [📥 은행 CSV 등록] 버튼으로 진입.
//   1) 은행 CSV 파싱 (ANZ 3컬럼 / Suncorp 4컬럼 자동감지)
//   2) 입금(양수)만 추림 · 지출 자동 제외
//   3) description에서 이름·상호·REF NO·인보이스번호(AT2026-XXXXX) 추출
//   4) 거래처 자동매칭 (인보이스 → 상호 → 이름 → 부분매칭)
//   5) bankRef 중복 방지 · 배치ID로 감사로그 · 롤백 가능
// =========================================================================
window.BANK_CSV = window.BANK_CSV || {};
BANK_CSV.parseCsvLine = function(line) {
  // 간단 CSV 파서 — 큰따옴표 · 내부 콤마 처리
  const out = [];
  let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (inQ) {
      if (ch === '"' && line[i+1] === '"') { cur += '"'; i++; }
      else if (ch === '"') inQ = false;
      else cur += ch;
    } else {
      if (ch === '"') inQ = true;
      else if (ch === ',') { out.push(cur); cur = ''; }
      else cur += ch;
    }
  }
  out.push(cur);
  return out;
};

BANK_CSV.detectBank = function(text) {
  // ⭐ M1 fix: BOM(UTF-8 BOM) 제거
  if (text && text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const firstLine = (text.split(/\r?\n/)[0] || '').trim();
  const secondLine = (text.split(/\r?\n/)[1] || '').trim();
  if (/^"?Account History for Account/i.test(firstLine)) return 'suncorp';
  // Suncorp: 4컬럼 · $ 심볼
  const cols = BANK_CSV.parseCsvLine(text.split(/\r?\n/).find(l => l && !/^"?Account|^"?\d+ items/i.test(l)) || '');
  if (cols.length === 4 && /\$/.test(cols[2] || '')) return 'suncorp';
  // ANZ: 3컬럼 · 첫 컬럼 DD/MM/YYYY
  if (cols.length === 3 && /^\d{2}\/\d{2}\/\d{4}$/.test((cols[0] || '').trim())) return 'anz';
  return 'unknown';
};

BANK_CSV.dmyToISO = function(dmy) {
  // "10/08/2026" → "2026-08-10"
  const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec((dmy || '').trim());
  if (!m) return null;
  return m[3] + '-' + m[2] + '-' + m[1];
};

BANK_CSV.parseAmount = function(s) {
  // "$1,234.56" · "-$1,234.56" · "1234.56" · "-61.60" · "(123.45)" (회계용 음수)
  if (s == null) return NaN;
  let str = String(s).trim();
  // ⭐ H1 fix: "(123.45)" 은 회계 음수 표기 — 부호 뒤집기
  let negParen = false;
  if (/^\(.+\)$/.test(str)) { negParen = true; str = str.slice(1, -1); }
  str = str.replace(/[\$,\s]/g, '');
  const n = parseFloat(str);
  if (isNaN(n)) return NaN;
  return negParen ? -Math.abs(n) : n;
};

// ⭐ H2 fix: 시드니 로컬 날짜에서 N일 더하기 (UTC 변환 없이 로컬 컴포넌트 사용)
BANK_CSV.localISOAfterDays = function(baseISO, days) {
  const d = new Date(baseISO + 'T12:00:00');
  d.setDate(d.getDate() + days);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
};

BANK_CSV.parseFile = function(text, bankHint) {
  // ⭐ M1 fix: BOM 제거
  if (text && text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const bank = bankHint || BANK_CSV.detectBank(text);
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  const rows = [];
  for (const line of lines) {
    if (/^"?Account History|^"?\d+ items/i.test(line)) continue; // Suncorp 메타
    const cols = BANK_CSV.parseCsvLine(line);
    let dateISO, amount, descr;
    if (bank === 'suncorp' && cols.length >= 3) {
      dateISO = BANK_CSV.dmyToISO(cols[0]);
      descr = (cols[1] || '').trim();
      amount = BANK_CSV.parseAmount(cols[2]);
    } else if (bank === 'anz' && cols.length >= 3) {
      dateISO = BANK_CSV.dmyToISO(cols[0]);
      amount = BANK_CSV.parseAmount(cols[1]);
      descr = (cols[2] || '').trim();
    } else continue;
    if (!dateISO || isNaN(amount)) continue;
    rows.push({ dateISO, amount, descr, bank });
  }
  return { bank, rows };
};

BANK_CSV.extractDescriptionFields = function(descr) {
  // 리턴: { type, senderName, businessGuess, refNo, invoiceHints:[], cleaned }
  let d = ' ' + (descr || '') + ' ';
  const out = { type: '', senderName: '', businessGuess: '', refNo: '', invoiceHints: [], cleaned: '' };

  // 1) REF NO 추출
  const mRef = /\bREF\s*NO\s+(\d+)/i.exec(d);
  if (mRef) { out.refNo = mRef[1]; d = d.replace(mRef[0], ' '); }

  // 2) EFFECTIVE DATE 제거
  d = d.replace(/\bEFFECTIVE\s+DATE\s+\d{2}\/\d{2}\/\d{4}\b/ig, ' ');

  // 3) 인보이스 번호 (AT2026-XXXXX / AT202603932 / AT 2026 02579 / 쉼표로 여러 개)
  //    5자리 형태로 통일 (선행 0 유지)
  //    ⭐ 반드시 "AT" 접두 뒤 "2026" 을 스킵하고 그 뒤 4~5자리만 잡아야 함
  const addInv = (n) => {
    if (!n) return;
    if (n === '2026') return;
    let norm = n;
    if (n.length > 5) norm = n.slice(-5);
    if (n.length < 5) norm = n.padStart(5, '0');
    if (!out.invoiceHints.includes(norm)) out.invoiceHints.push(norm);
  };
  const invRe = /\bAT[\s\-]?2026[\s\-]?(\d{4,5})((?:\s*,\s*\d{4,5})*)/ig;
  let mInv;
  while ((mInv = invRe.exec(d))) {
    addInv(mInv[1]);
    const trail = mInv[2] || '';
    const trailNums = trail.match(/\d{4,5}/g) || [];
    trailNums.forEach(addInv);
  }
  d = d.replace(invRe, ' ');
  // 4b) 별도 형태: "AT-05704" or "ATM AT202605704" 는 위 regex 로 잡히지만
  //     "INV 843" 같은 옛 형식은 무시.

  // 4) 유형 (OSKO / NPP / DIRECT CREDIT / TRANSFER)
  const mType = /\b(OSKO PAYMENT|NPP PAYMENT|DIRECT CREDIT|TRANSFER)\s+FROM\s+/i.exec(d);
  if (mType) {
    out.type = mType[1].toUpperCase().replace(/\s+/g, '_');
    d = d.slice((d.indexOf(mType[0]) + mType[0].length));
  } else {
    // ANZ style: "TRANSFER FROM XXX", "DEPOSIT", "PAYMENT TO ..." (지출)
    const mAlt = /\b(TRANSFER FROM|DEPOSIT|CREDIT INTEREST)\b\s*/i.exec(d);
    if (mAlt) {
      out.type = mAlt[1].toUpperCase().replace(/\s+/g, '_');
      d = d.slice(d.indexOf(mAlt[0]) + mAlt[0].length);
    }
  }

  // 5) REFERENCE ... 앞 부분 만 남기고 뒤는 상호/부가설명
  //    "REFERENCE <text>" 를 별도로 뽑아 businessGuess 후보로
  const mReference = /\bREFERENCE\s+(.+?)$/i.exec(d);
  let referenceText = '';
  if (mReference) { referenceText = mReference[1].trim(); d = d.replace(mReference[0], ' '); }

  // 5b) 흔한 노이즈 토큰 제거 — 은행 앱이 붙이는 것들
  //     " ATM " (수신은행 ATM 접미), "MS ", "MR ", "MRS " (경칭), 날짜 조각 등
  d = d.replace(/\bATM\b/g, ' ');
  d = d.replace(/\b(MS|MR|MRS|DR)\s+/g, ' ');
  d = d.replace(/\b\d{2}\/\d{2}\/\d{2,4}\b/g, ' '); // 날짜 조각
  d = d.replace(/\b\d{1,2}\s+(JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)\b/ig, ' ');
  d = d.replace(/\s+/g, ' ').trim();
  d = d.replace(/[,;]\s*$/, ''); // 트레일링 콤마
  out.cleaned = d;

  // 6) sender / business 분리
  //    "JIHYE MUN Obongzip" → senderName="JIHYE MUN", businessGuess="Obongzip"
  //    "LIDCOMBE MEAT PTY LTD" → senderName=""(대문자 회사), businessGuess=whole
  //    "stra dondon" → 전체를 businessGuess
  //    "JAE JANG" (사람이름만) → senderName=whole
  const words = d.split(/\s+/).filter(Boolean);
  const isCorpToken = t => /^(PTY|LTD|LTD\.|CO|CO\.|INC|T\/AS)$/i.test(t);
  const isAllUpperName = t => t.length >= 2 && /^[A-Z]+$/.test(t);
  // 첫 대문자 이름 뭉치를 sender 로, 그 뒤를 business 로
  let cutIdx = -1;
  for (let i = 0; i < words.length; i++) {
    if (!isAllUpperName(words[i])) { cutIdx = i; break; }
    // 회사 표기 만나면 sender 전체가 회사
    if (i > 0 && isCorpToken(words[i])) { cutIdx = -1; break; }
  }
  if (words.some(isCorpToken)) {
    // PTY/LTD 포함 → 회사 이름 전체를 business (T/AS 뒤가 있으면 그것도 business)
    out.senderName = '';
    out.businessGuess = d;
  } else if (cutIdx > 0) {
    out.senderName = words.slice(0, cutIdx).join(' ');
    out.businessGuess = words.slice(cutIdx).join(' ');
  } else if (cutIdx === 0) {
    // 첫 단어부터 대문자 아님 → 전부 business
    out.senderName = '';
    out.businessGuess = d;
  } else {
    // 전부 대문자 사람 이름
    out.senderName = d;
    out.businessGuess = '';
  }

  // REFERENCE 텍스트가 상호처럼 보이면 businessGuess 로 승격
  if (referenceText && !out.businessGuess) {
    out.businessGuess = referenceText;
  } else if (referenceText && out.businessGuess &&
             referenceText.toLowerCase() !== out.businessGuess.toLowerCase()) {
    out.businessGuess = out.businessGuess + ' / ' + referenceText;
  }
  return out;
};

// ⭐ (2026-08-11) 학습된 은행이름 → 거래처 매핑 조회
BANK_CSV.normKey = function(s) {
  return String(s || '').toLowerCase()
    .replace(/[^\w\s가-힣]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
};
BANK_CSV.lookupLearnedMap = function(fields) {
  const map = (DB && DB.bankSenderMap) || {};
  const senderKey = BANK_CSV.normKey(fields.senderName);
  const bizKey = BANK_CSV.normKey(fields.businessGuess);
  const fullKey = BANK_CSV.normKey((fields.senderName||'') + ' ' + (fields.businessGuess||''));
  // 우선순위: full > sender > biz (풀 매칭이 가장 구체적)
  for (const k of [fullKey, senderKey, bizKey]) {
    if (k && map[k]) {
      const c = (DB.customers || []).find(x => x.id === map[k]);
      if (c && c.active !== false) return { cid: c.id, custName: c.name, reason: '학습된 매핑 (' + k + ')' };
    }
  }
  return null;
};

BANK_CSV.matchCustomer = function(fields) {
  // ⭐ 0. 학습된 매핑 우선 (score 100)
  const learned = BANK_CSV.lookupLearnedMap(fields);
  if (learned) return { cid: learned.cid, custName: learned.custName, score: 100, reason: learned.reason };

  // 매칭 확률 (0~100). 결과: { cid, score, reason, custName }
  const customers = (DB.customers || []).filter(c => c && c.active !== false);
  if (customers.length === 0) return null;
  const norm = s => String(s || '').toLowerCase().replace(/\s+/g, ' ').replace(/[.,'"]/g, '').trim();
  const sender = norm(fields.senderName);
  const biz = norm(fields.businessGuess);
  const full = norm((fields.senderName || '') + ' ' + (fields.businessGuess || ''));

  let best = null;
  for (const c of customers) {
    const name = norm(c.name);
    const contact = norm(c.contact);
    const code = norm(c.code);
    let score = 0;
    let reasons = [];
    // 정확 일치 (상호)
    if (biz && name && biz === name) { score = Math.max(score, 100); reasons.push('상호 정확'); }
    else if (full && name && full === name) { score = Math.max(score, 100); reasons.push('상호 정확'); }
    // 상호가 포함
    else if (biz && name && (biz.includes(name) || name.includes(biz))) { score = Math.max(score, 85); reasons.push('상호 포함'); }
    else if (full && name && (full.includes(name) || name.includes(full))) { score = Math.max(score, 80); reasons.push('상호 부분'); }
    // 담당자 이름 일치
    if (sender && contact && (sender === contact || sender.includes(contact) || contact.includes(sender))) {
      score = Math.max(score, 90); reasons.push('담당자 일치');
    }
    // 코드 일치
    if (code && (biz === code || sender === code || full === code)) {
      score = Math.max(score, 95); reasons.push('코드 일치');
    }
    // 단어 단위 부분 매칭 (2단어 이상 겹치면)
    if (score < 60 && name) {
      const nameWords = name.split(' ').filter(w => w.length >= 3);
      const searchStr = (biz + ' ' + sender).trim();
      const hits = nameWords.filter(w => searchStr.includes(w)).length;
      if (hits >= 2) { score = Math.max(score, 70); reasons.push('단어 2+개'); }
      else if (hits === 1 && nameWords.length === 1) { score = Math.max(score, 60); reasons.push('단일단어'); }
    }
    if (score > 0 && (!best || score > best.score)) {
      best = { cid: c.id, custName: c.name, score, reason: reasons.join(', ') };
    }
  }
  return best;
};

BANK_CSV.matchInvoice = function(fields, cidHint, amount) {
  // 인보이스 번호 힌트가 있으면 매칭 시도. cidHint 있으면 우선 그 거래처 인보이스만.
  const orders = (DB.orders || []).filter(o => o && (o.status === 'delivered' || o.status === 'invoiced'));
  if (fields.invoiceHints && fields.invoiceHints.length > 0) {
    for (const hint of fields.invoiceHints) {
      // invoiceNo가 hint로 끝나는지 (뒤 5자리 매칭)
      const cand = orders.filter(o => {
        const inv = String(o.invoiceNo || '');
        if (!inv) return false;
        return inv === hint || inv.endsWith(hint) || inv.padStart(5,'0') === hint;
      });
      if (cand.length === 1) return { orderId: cand[0].id, invNo: cand[0].invoiceNo || cand[0].orderNo, cid: cand[0].customerId, reason: '인보이스# 매칭' };
      if (cand.length > 1 && cidHint) {
        const narrow = cand.find(o => o.customerId === cidHint);
        if (narrow) return { orderId: narrow.id, invNo: narrow.invoiceNo || narrow.orderNo, cid: narrow.customerId, reason: '인보이스# + 거래처' };
      }
    }
  }
  return null;
};

// 파일 로드 → 파싱 → 미리보기 렌더링용 데이터 생성
BANK_CSV.buildPreview = function(text, opts) {
  opts = opts || {};
  const { bank, rows } = BANK_CSV.parseFile(text, opts.bankHint);
  // ⭐ 중복 방지: bankRef 셋 + composite 키 셋 (bankRef 없는 건 대비)
  const existingRefs = new Set();
  const existingComposites = new Set();
  const _mkComposite = (bnk, dISO, amt, dscr) =>
    (bnk||'') + '|' + (dISO||'') + '|' + Math.round((amt||0)*100) + '|' + String(dscr||'').slice(0,30).toLowerCase();
  (DB.payments || []).forEach(p => {
    if (!p) return;
    if (p.bankRef) existingRefs.add(String(p.bankRef));
    if (p.bankSource) existingComposites.add(_mkComposite(p.bankSource, p.bankDate || p.date, p.amount, p.notes || ''));
  });

  // ⭐ (2026-08-12) 날짜 필터 제거 — CSV는 매번 7일치 정도만 다운로드해서 올림.
  //   중복은 bankRef + composite 키로 자동 감지 → 필터 없이도 안전.

  const items = [];
  rows.forEach((r, idx) => {
    if (r.amount <= 0) return; // 지출 스킵
    const fields = BANK_CSV.extractDescriptionFields(r.descr);
    const compKey = _mkComposite(bank, r.dateISO, r.amount, '[' + (bank||'').toUpperCase() + ' CSV] ' + (fields.senderName||'') + (fields.businessGuess ? ' / ' + fields.businessGuess : ''));
    const isDup = (fields.refNo && existingRefs.has(String(fields.refNo))) || existingComposites.has(compKey);
    const custMatch = BANK_CSV.matchCustomer(fields);
    const invMatch = BANK_CSV.matchInvoice(fields, custMatch && custMatch.cid, r.amount);
    // 인보이스 매칭이 거래처를 확정해줄 수도 있음
    let finalCid = null, finalCustName = '', matchConfidence = 0, matchNote = '';
    if (invMatch) {
      finalCid = invMatch.cid;
      const c = (DB.customers || []).find(x => x.id === finalCid);
      finalCustName = c ? c.name : '(?)';
      matchConfidence = 100;
      matchNote = invMatch.reason;
    } else if (custMatch) {
      finalCid = custMatch.cid;
      finalCustName = custMatch.custName;
      matchConfidence = custMatch.score;
      matchNote = custMatch.reason;
    }
    items.push({
      idx,
      dateISO: r.dateISO,
      amount: r.amount,
      descr: r.descr,
      fields,
      cid: finalCid,
      custName: finalCustName,
      confidence: matchConfidence,
      note: matchNote,
      invMatch: invMatch,
      isDup,
      selected: !isDup && matchConfidence >= 70,
    });
  });
  return { bank, items, dupCount: items.filter(x => x.isDup).length };
};

window.bankCsvLoadFile = function() {
  const fi = document.getElementById('bankCsvFile');
  if (!fi || !fi.files || !fi.files[0]) { alert('CSV 파일을 먼저 선택하세요.'); return; }
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const text = e.target.result;
      const hint = document.getElementById('bankCsvBankHint').value || '';
      const preview = BANK_CSV.buildPreview(text, { bankHint: hint });
      BANK_CSV._preview = preview;
      if (preview.items.length > 500) {
        if (!confirm('⚠️ ' + preview.items.length + '건이 감지되었습니다. 화면이 무거울 수 있습니다.\n최근 7일치 CSV만 다운로드하는 걸 권장합니다.\n\n그래도 계속 표시할까요?')) {
          BANK_CSV._preview = null;
          return;
        }
      }
      bankCsvRenderPreview();
    } catch(err) {
      console.error('CSV 파싱 실패:', err);
      alert('CSV 파싱 실패: ' + err.message + '\n\n파일 형식(ANZ 3컬럼 · Suncorp 4컬럼)을 확인하세요.');
    }
  };
  reader.onerror = function() { alert('파일 읽기 실패'); };
  reader.readAsText(fi.files[0]);
};

window.bankCsvRenderPreview = function() {
  const wrap = document.getElementById('bankCsvPreview');
  const preview = BANK_CSV._preview;
  if (!wrap || !preview) return;
  const items = preview.items;
  const stat = document.getElementById('bankCsvStat');
  const totalAmt = items.reduce((s,i) => s + i.amount, 0);
  const selCnt = items.filter(i => i.selected).length;
  const selAmt = items.filter(i => i.selected).reduce((s,i) => s + i.amount, 0);
  if (stat) stat.innerHTML = '은행: <b>' + (preview.bank || '?').toUpperCase() + '</b> · 입금 ' + items.length + '건 · $' + fmtMoney(totalAmt) + (preview.dupCount ? ' · 중복 ' + preview.dupCount + '건 (자동스킵)' : '');
  const saveInfo = document.getElementById('bankCsvSaveInfo');
  if (saveInfo) saveInfo.innerHTML = '선택 <b>' + selCnt + '건</b> · $' + fmtMoney(selAmt);
  const saveBtn = document.getElementById('bankCsvSaveBtn');
  if (saveBtn) saveBtn.disabled = selCnt === 0;

  if (items.length === 0) {
    wrap.innerHTML = '<div style="text-align:center; padding:40px; color:var(--muted);">입금 항목이 없습니다. 날짜 범위 · 은행 선택을 확인해 주세요.</div>';
    return;
  }
  // 거래처 옵션 (수동 지정용)
  const custOptions = (DB.customers || []).filter(c => c.active !== false)
    .sort((a,b) => (a.name || '').localeCompare(b.name || ''))
    .map(c => '<option value="' + c.id + '">' + escapeHtmlSimple(c.name) + '</option>')
    .join('');

  const rowHtml = items.map((it, i) => {
    let bg = '#fff', tag = '', tagColor = '';
    if (it.isDup) { bg = '#F5F5F5'; tag = '중복'; tagColor = '#999'; }
    else if (it.confidence >= 100) { bg = '#E8F5E9'; tag = '완벽매칭'; tagColor = '#2E7D32'; }
    else if (it.confidence >= 85) { bg = '#F1F8E9'; tag = '고신뢰(' + it.confidence + '%)'; tagColor = '#558B2F'; }
    else if (it.confidence >= 60) { bg = '#FFF9C4'; tag = '중신뢰(' + it.confidence + '%)'; tagColor = '#F57F17'; }
    else if (it.confidence > 0) { bg = '#FFF3E0'; tag = '저신뢰(' + it.confidence + '%)'; tagColor = '#E65100'; }
    else { bg = '#FFEBEE'; tag = '매칭실패'; tagColor = '#C62828'; }
    const invHint = it.fields.invoiceHints.length ? ' <span style="color:#5E35B1; font-size:10px;">AT' + it.fields.invoiceHints.join(',') + '</span>' : '';
    const refHint = it.fields.refNo ? ' <span style="color:var(--muted); font-size:10px;">R:' + it.fields.refNo + '</span>' : '';
    const selValue = it.cid || '';
    return '<tr style="background:' + bg + ';">'
      + '<td style="padding:4px 6px; text-align:center;"><input type="checkbox" ' + (it.selected ? 'checked' : '') + ' ' + (it.isDup ? 'disabled' : '') + ' onchange="bankCsvToggleRow(' + i + ', this.checked)"></td>'
      + '<td style="padding:4px 6px; font-size:11px; white-space:nowrap;">' + it.dateISO + '</td>'
      + '<td style="padding:4px 6px; text-align:right; font-weight:700; white-space:nowrap;">$' + fmtMoney(it.amount) + '</td>'
      + '<td style="padding:4px 6px; font-size:11px; max-width:280px; word-break:break-word;">'
        + '<div style="color:#333;">' + escapeHtmlSimple(it.fields.senderName || '') + (it.fields.businessGuess ? ' <b>' + escapeHtmlSimple(it.fields.businessGuess) + '</b>' : '') + '</div>'
        + '<div style="color:#999; font-size:10px;">' + escapeHtmlSimple((it.descr || '').substring(0, 100)) + refHint + invHint + '</div>'
      + '</td>'
      + '<td style="padding:4px 6px; min-width:220px;">'
        + '<select onchange="bankCsvSetCustomer(' + i + ', this.value)" style="width:100%; padding:4px; font-size:11px; border:1px solid var(--line); border-radius:4px;">'
        + '<option value="">— 매칭 없음 —</option>'
        + custOptions.replace('value="' + selValue + '"', 'value="' + selValue + '" selected')
        + '</select>'
        + (it.note ? '<div style="font-size:10px; color:var(--muted); margin-top:2px;">' + escapeHtmlSimple(it.note) + '</div>' : '')
      + '</td>'
      + '<td style="padding:4px 6px; text-align:center;"><span style="background:' + tagColor + '; color:#fff; padding:2px 6px; border-radius:4px; font-size:10px; font-weight:700;">' + tag + '</span></td>'
      + '</tr>';
  }).join('');

  wrap.innerHTML = '<table style="width:100%; border-collapse:collapse; font-size:12px;">'
    + '<thead style="position:sticky; top:0; background:#FAFAFA; z-index:1;"><tr style="border-bottom:2px solid var(--line);">'
    + '<th style="padding:6px 4px; width:40px;">✓</th>'
    + '<th style="padding:6px 4px;">날짜</th>'
    + '<th style="padding:6px 4px; text-align:right;">금액</th>'
    + '<th style="padding:6px 4px; text-align:left;">파싱된 내용 · 원본</th>'
    + '<th style="padding:6px 4px;">매칭 거래처 (수정 가능)</th>'
    + '<th style="padding:6px 4px;">상태</th>'
    + '</tr></thead>'
    + '<tbody>' + rowHtml + '</tbody></table>';
};
