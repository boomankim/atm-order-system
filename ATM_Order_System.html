// orphan 감지: 인보이스/배송완료 상태이면서 거래처가 없거나 orderNo가 없거나 오프닝 발란스 의심
function _detectOrphanOrders() {
  const custIds = new Set(DB.customers.map(function(c){ return c.id; }));
  const OPENING_KEYWORDS = ['오프닝', 'opening', '발란스', 'balance'];
  return DB.orders.filter(function(o) {
    if (!o || (o.status !== 'invoiced' && o.status !== 'delivered')) return false;
    const noCust = !o.customerId || !custIds.has(o.customerId);
    const noOrderNo = !o.orderNo;
    const items = (o.invoiceItems || o.items || []);
    const openingSuspect = items.some(function(it) {
      const nm = (it && it.name || '').toLowerCase();
      return OPENING_KEYWORDS.some(function(kw) { return nm.indexOf(kw) >= 0; });
    });
    // 태그
    o._noCust = noCust;
    o._noOrderNo = noOrderNo;
    o._openingSuspect = openingSuspect;
    return noCust || noOrderNo || openingSuspect;
  });
}

// 개별 삭제
window.orphanDeleteOne = function(orderId) {
  const o = DB.orders.find(function(x){ return x.id === orderId; });
  if (!o) return alert('인보이스를 찾을 수 없습니다.');
  const totals = computeTotals(o);
  if (!confirm('이 인보이스를 삭제합니다.\n\n' +
    '인보이스#: ' + (o.invoiceNo || '-') + '\n' +
    '주문번호: ' + (o.orderNo || '(없음)') + '\n' +
    '금액: $' + fmtMoney(totals.grand) + '\n\n' +
    '되돌릴 수 없습니다. 계속?')) return;
  DB.orders = DB.orders.filter(function(x){ return x.id !== orderId; });
  // 관련 크레딧 노트도 삭제
  const beforeCN = (DB.creditNotes || []).length;
  DB.creditNotes = (DB.creditNotes || []).filter(function(cn){ return cn.orderId !== orderId; });
  const cnDeleted = beforeCN - (DB.creditNotes || []).length;
  saveDB();
  alert('✅ 삭제 완료' + (cnDeleted > 0 ? ' (관련 크레딧 노트 ' + cnDeleted + '건 함께 삭제)' : ''));
  renderOrphanAdmin();
};

// 거래처 매핑 (customerId 갱신)
window.orphanAssignCustomer = function(orderId, newCustId) {
  if (!newCustId) return;
  const o = DB.orders.find(function(x){ return x.id === orderId; });
  if (!o) return alert('인보이스를 찾을 수 없습니다.');
  const c = DB.customers.find(function(x){ return x.id === newCustId; });
  if (!c) return alert('거래처를 찾을 수 없습니다.');
  if (!confirm('이 인보이스의 거래처를 다음으로 설정합니다:\n\n' +
    (c.name || '') + ' (' + (c.code || '') + ')\n\n계속?')) return;
  o.customerId = newCustId;
  saveDB();
  alert('✅ 거래처 매핑 완료. 다시 진단하여 정상 반영을 확인하세요.');
  renderOrphanAdmin();
};

// 전체 삭제
window.orphanDeleteAll = function() {
  const orphans = _detectOrphanOrders();
  if (orphans.length === 0) return alert('삭제할 orphan이 없습니다.');
  const typed = prompt('⚠️ orphan 인보이스 ' + orphans.length + '건을 모두 삭제합니다.\n\n되돌릴 수 없습니다. 실행하려면 "삭제" 를 정확히 입력하세요.', '');
  if (typed === null) return;
  if (typed.trim() !== '삭제') return alert('입력이 일치하지 않아 취소되었습니다.');
  const orphanIds = new Set(orphans.map(function(o){ return o.id; }));
  DB.orders = DB.orders.filter(function(o){ return !orphanIds.has(o.id); });
  const beforeCN = (DB.creditNotes || []).length;
  DB.creditNotes = (DB.creditNotes || []).filter(function(cn){ return !orphanIds.has(cn.orderId); });
  const cnDeleted = beforeCN - (DB.creditNotes || []).length;
  saveDB();
  alert('✅ 전체 삭제 완료 — ' + orphans.length + '건' + (cnDeleted > 0 ? ' + 관련 크레딧 노트 ' + cnDeleted + '건' : ''));
  renderOrphanAdmin();
};

function _hasHangulText(s) { return /[가-힯㄰-㆏]/.test(s); }
function _hasEnglishText(s) { return /[A-Za-z]/.test(s); }

function _toTitleCase(s) {
  return String(s || '').replace(/([A-Za-z])([A-Za-z0-9]*)/g, function(_, first, rest) {
    return first.toUpperCase() + rest.toLowerCase();
  });
}

// 한글 시퀀스와 영문/숫자 시퀀스 분리
function _splitKoEn(s) {
  let ko = '', en = '';
  let i = 0;
  while (i < s.length) {
    const ch = s.charAt(i);
    if (/[가-힯㄰-㆏]/.test(ch)) {
      let j = i;
      while (j < s.length && /[가-힯㄰-㆏\s]/.test(s.charAt(j))) j++;
      ko += s.substring(i, j) + ' ';
      i = j;
    } else {
      let j = i;
      while (j < s.length && !/[가-힯㄰-㆏]/.test(s.charAt(j))) j++;
      en += s.substring(i, j) + ' ';
      i = j;
    }
  }
  return [ko.replace(/\s+/g, ' ').trim(), en.replace(/\s+/g, ' ').trim()];
}

function _completeKorean(ko) {
  if (KO_COMPLETE[ko]) return KO_COMPLETE[ko];
  const firstSpace = ko.indexOf(' ');
  if (firstSpace > 0) {
    const first = ko.substring(0, firstSpace);
    if (KO_COMPLETE[first]) return KO_COMPLETE[first] + ko.substring(firstSpace);
  }
  return ko;
}

function _lookupEnglish(ko) {
  if (KO_TO_EN[ko]) return KO_TO_EN[ko];
  // 긴 키 먼저 매칭 (예: '소불고기 척롤슬라이스' 가 '소불고기' 보다 우선)
  const sorted = Object.keys(KO_TO_EN).sort((a, b) => b.length - a.length);
  for (const key of sorted) {
    if (ko === key) return KO_TO_EN[key];
    if (ko.startsWith(key)) {
      const next = ko.charAt(key.length);
      // 키워드 뒤가 한글이면 다른 단어 → 매칭 X (갈비탕에 갈비 매칭되는 거 방지)
      // 키워드 뒤가 공백/숫자/특수/끝이면 매칭
      if (next === ' ' || next === '' || /[0-9.()*&_+\-/]/.test(next)) {
        const suffix = ko.substring(key.length).trim();
        return KO_TO_EN[key] + (suffix ? ' ' + suffix : '');
      }
    }
  }
  return null;
}

// 품목명을 "한글명 / English Name" 형식으로 정규화
function normalizeProductName(rawName) {
  if (!rawName) return rawName;
  let name = rawName.trim();
  // 이미 슬래시 형식이면 그대로 (수동 편집 보호)
  if (name.indexOf(' / ') >= 0) return name;

  const hasKo = _hasHangulText(name);
  const hasEn = _hasEnglishText(name);

  if (hasEn && !hasKo) {
    // 영문만 → 그대로 (사용자 요구)
    return name;
  }
  if (hasKo && hasEn) {
    // 한글+영문 혼재 → 분리 후 슬래시로 합침
    const [koRaw, enRaw] = _splitKoEn(name);
    const ko = _completeKorean(koRaw);
    const en = _toTitleCase(enRaw);
    return ko + (en ? ' / ' + en : '');
  }
  if (hasKo && !hasEn) {
    // 한글만 → 완성형 + 영문 매칭
    const ko = _completeKorean(name);
    const en = _lookupEnglish(ko);
    return en ? ko + ' / ' + en : ko;
  }
  return name;
}

// 분류(cut) 정렬 순서 — ⭐ (2026-08-06) 오리·양이 작업육·가공육 앞으로 이동
const CUT_ORDER = ['와규','소고기','돼지고기','오리','양고기','작업육','가공육','공산품'];
// 분류 표시 라벨 — 한글 / English 병기
const CUT_LABEL = {
  '와규': '와규 / Wagyu',
  '소고기': '소고기 / Beef',
  '돼지고기': '돼지고기 / Pork',
  '작업육': '작업육/cut',
  '가공육': '가공육 / Cured',
  '양고기': '양고기 / Lamb',
  '오리': '오리 / Duck',
  '공산품': '공산품 / Goods'
};
function cutLabel(c) { return CUT_LABEL[c] || (c || '-'); }
function compareCut(a, b) {
  const ia = CUT_ORDER.indexOf(a);
  const ib = CUT_ORDER.indexOf(b);
  // 정의된 순서에 없으면 맨 뒤
  const va = ia < 0 ? 999 : ia;
  const vb = ib < 0 ? 999 : ib;
  if (va !== vb) return va - vb;
  return (a || '').localeCompare(b || '', 'ko-KR');
}

// 첫 글자가 한글인지 확인 (음절·자모·호환자모 포함)
function isHangulChar(ch) {
  if (!ch) return false;
  const code = ch.charCodeAt(0);
  return (code >= 0xAC00 && code <= 0xD7AF)  // 한글 음절
      || (code >= 0x1100 && code <= 0x11FF)  // 한글 자모
      || (code >= 0x3130 && code <= 0x318F); // 한글 호환 자모
}
// 한글 가나다 우선 → 영어 알파벳 → 그 외 순서로 비교
function compareKorEng(a, b) {
  const sa = (a || '').toString().trim();
  const sb = (b || '').toString().trim();
  const ha = isHangulChar(sa.charAt(0)) ? 0 : 1;
  const hb = isHangulChar(sb.charAt(0)) ? 0 : 1;
  if (ha !== hb) return ha - hb;          // 한글 그룹이 먼저
  return sa.localeCompare(sb, 'ko-KR', { sensitivity: 'base', numeric: true });
}

function renderProductList(q) {
  const filt = DB.products.filter(p => {
    if (!q) return true;
    const s = (p.name + ' ' + p.cut + ' ' + p.brand).toLowerCase();
    return s.includes(q.toLowerCase());
  });
  // 분류 1차 (고정 순서: 와규→소고기→돼지고기→작업육→가공육→양고기→오리→공산품)
  // 품목명 2차 (한글 가나다 → 영어 알파벳 순)
  filt.sort((p1, p2) => {
    const c = compareCut(p1.cut, p2.cut);
    if (c !== 0) return c;
    return compareKorEng(p1.name, p2.name);
  });
  document.getElementById('prodList').innerHTML = `
    <table class="t">
      <thead><tr>
        <th>분류</th><th>품목</th><th>브랜드</th>

          <td>${p.active ? '✅' : '⛔'}</td>
          <td class="act">
            <button class="btn sm secondary" onclick="editProduct('${p.id}')">수정</button>

          </td>
        </tr>
      `).join('')}</tbody>
    </table>
  `;
}

function updateProductField(prodId, field, value) {
  const p = DB.products.find(x => x.id === prodId);
  if (!p) return;
  if (field === 'priceKg') {
    const v = parseFloat(value);
    p[field] = isNaN(v) ? 0 : v;
  } else if (field === 'active') {
    p[field] = !!value;
  } else if (field === 'name') {
    const trimmed = String(value || '').trim();
    if (!trimmed) {
      alert('품목명은 비울 수 없습니다.');
      renderProductsAdmin(); // re-render to revert
      return;
    }
    p[field] = trimmed;
  } else {
    p[field] = String(value || '').trim();
  }
  // Phase 2 동시성: 이 품목의 해당 필드만 업데이트 (다른 사용자의 다른 품목 작업 안전)
  saveEntityField('products', prodId, field);
}

function saveProduct(id, isNew) {
  const obj = {
    id, name: val('m_name').trim(), cut: val('m_cut'), brand: val('m_brand').trim(),
    boxKg: 0, packKg: 0, // deprecated, kept for schema compatibility
    priceKg: parseFloat(val('m_price'))||0, active: document.getElementById('m_active').checked
  };
  if (!obj.name) return alert('품목명을 입력하세요.');
  if (isNew === 'true' || isNew === true) {
    DB.products.push(obj);
    // Phase 2 동시성: 트랜잭션으로 안전하게 신규 품목 추가
    pushEntityToFirebase('products', obj);
  } else {
    const i = DB.products.findIndex(p => p.id === id);
    DB.products[i] = obj;
    // Phase 2 동시성: 이 품목만 부분 업데이트
    saveEntity('products', id, obj);
  }
  saveLocalDB();
  closeModal(); renderProductsAdmin();
}
function delProduct(id) {
  if (!confirm('이 품목을 삭제하시겠습니까?')) return;
  DB.products = DB.products.filter(p => p.id !== id);
  // Phase 2 동시성: 트랜잭션으로 안전하게 품목 제거
  removeEntityFromFirebase('products', id);
  saveLocalDB();
  renderProductsAdmin();
}

// 거래처 코드 다음 순번
// 기존 거래처 코드의 끝자리 숫자 중 최댓값 + 1 (4자리 zero-pad)
function nextCustomerCodeNumber() {
  let max = 0;
  for (const cc of DB.customers) {
    const m = (cc.code || '').match(/(\d+)\s*$/);
    if (m) {
      const n = parseInt(m[1], 10);
      if (!isNaN(n) && n > max) max = n;
    }
  }
  return String(max + 1).padStart(4, '0');
}

// 기존 코드를 prefix(문자) + number(끝의 숫자)로 분리
function splitCustomerCode(code) {
  const m = (code || '').match(/^(.*?)(\d+)\s*$/);
  if (m) return { prefix: m[1], num: m[2] };
  return { prefix: code || '', num: '' };
}

// 거래처 이름에서 영문/숫자 앞 2글자 자동 추출 (대문자, 없으면 빈값)
function autoDerivePrefix(name) {
  if (!name) return '';
  const m = String(name).toUpperCase().match(/[A-Z0-9]{1,2}/);
  if (!m) return '';
  // 첫 매치가 1글자이면 다음 영숫자도 합쳐서 2글자 시도
  const all = String(name).toUpperCase().replace(/[^A-Z0-9]/g, '');
  return all.slice(0, 2);
}

// 🔢 거래처 코드 일괄 재번호 모달
// 테스트 CUST001 / CUST002 는 제외하고 나머지를 DB 저장 순서대로 prefix+0001~ 부여

// ✂️ 끝 5자리 숫자 중 맨 앞자리가 0/2/3 인 거래처 코드를 4자리로 다듬기
//    예) MW20001 → MW0001, AB30005 → AB0005, CD00012 → CD0012
//    충돌(같은 코드가 이미 존재) 시 해당 건만 건너뜀
function trimFiveDigitCodes() {
  const re = /^(.*?)([023])(\d{4})\s*$/;
  const targets = [];
  for (const c of DB.customers) {
    const m = (c.code || '').match(re);
    if (m) targets.push({ cust: c, prefix: m[1], drop: m[2], keep: m[3], newCode: m[1] + m[3] });
  }
  if (targets.length === 0) {
    alert('대상 거래처가 없습니다.\n(끝 5자리 숫자 중 맨 앞이 0/2/3 인 코드 없음)');
    return;
  }
  // 충돌 검사
  const existingCodes = new Set(DB.customers.map(c => (c.code || '').toUpperCase()));
  const conflicts = [];
  const safe = [];
  for (const t of targets) {
    const newUpper = t.newCode.toUpperCase();
    // 자기 자신은 빼고 검사
    const others = new Set(DB.customers.filter(c => c.id !== t.cust.id).map(c => (c.code || '').toUpperCase()));
    if (others.has(newUpper)) conflicts.push(t);
    else safe.push(t);
  }
  const previewSafe = safe.slice(0, 8).map(t => `  ${t.cust.name}: ${t.cust.code} → ${t.newCode}`).join('\n');
  const previewConf = conflicts.slice(0, 5).map(t => `  ${t.cust.name}: ${t.cust.code} → ${t.newCode} (중복)`).join('\n');
  let msg = `✂️ 5→4자리 다듬기 미리보기\n\n대상 ${targets.length}곳 중 적용 가능 ${safe.length}곳`;
  if (conflicts.length) msg += ` / 충돌 ${conflicts.length}곳`;
  msg += `\n\n[적용 예시]\n${previewSafe}${safe.length > 8 ? `\n  ... 외 ${safe.length - 8}곳` : ''}`;
  if (conflicts.length) msg += `\n\n[충돌 — 건너뜀]\n${previewConf}${conflicts.length > 5 ? `\n  ... 외 ${conflicts.length - 5}곳` : ''}`;
  msg += '\n\n적용하시겠습니까?';
  if (!confirm(msg)) return;

  let changed = 0;
  for (const t of safe) {
    t.cust.code = t.newCode;
    changed++;
    try { saveEntityField('customers', t.cust.id, 'code'); } catch(e) { console.warn('Firebase code 저장 실패:', t.cust.id, e); }
  }
  saveDB();
  renderCustomersAdmin();
  alert(`✅ ${changed}곳 다듬기 완료${conflicts.length ? ` / ${conflicts.length}곳은 중복으로 건너뜀` : ''}.`);
}

function applyCustomerRenumber() {
  const rows = document.querySelectorAll('#renumTbody tr');
  const empty = [];
  rows.forEach(r => {
    const pf = r.querySelector('.renum-prefix').value.trim();
    if (!pf) empty.push(r.children[1].textContent);
  });
  if (empty.length > 0) {
    if (!confirm(`Prefix가 비어있는 거래처 ${empty.length}곳이 있습니다:\n\n${empty.slice(0,5).join(', ')}${empty.length>5?' 외 '+(empty.length-5)+'곳':''}\n\n이대로 진행하면 숫자만 코드가 됩니다. 계속할까요?`)) return;
  }
  if (!confirm(`${rows.length}개 거래처 코드를 일괄 변경합니다.\n\n실행 전 데이터 백업을 권장합니다.\n계속하시겠습니까?`)) return;

  let changed = 0;
  rows.forEach((r, idx) => {
    const cid = r.getAttribute('data-cid');
    const pf = r.querySelector('.renum-prefix').value.trim().toUpperCase();
    const num = String(idx + 1).padStart(4, '0');
    const newCode = pf + num;
    const cust = DB.customers.find(x => x.id === cid);
    if (cust && cust.code !== newCode) {
      cust.code = newCode;
      changed++;
      // Firebase 부분 업데이트
      try { saveEntityField('customers', cid, 'code'); } catch(e) { console.warn('Firebase code 저장 실패:', cid, e); }
    }
  });
  saveDB();
  closeModal();
  renderCustomersAdmin();
  alert(`✅ ${changed}개 거래처 코드 재번호 완료.\n\n새 거래처는 자동으로 ${nextCustomerCodeNumber()}번부터 시작됩니다.`);
}

// Feature 1: 거래처 맞춤 단가 섹션 (관리자 거래처 수정창에 표시)
// 새 구조: customPrices[productId] = { '': price, '진공포장': price, ... }
// 레거시 customPrices[productId] = number 도 같이 표시 (notes='' 로 취급).
function renderCustomPriceSection(custId) {
  const c = DB.customers.find(x => x.id === custId);
  if (!c) return '';
  const customPrices = c.customPrices || {};
  // 모든 (productId, notes, price) 짝을 평탄화
  const entries = [];
  Object.keys(customPrices).forEach(pid => {
    const product = DB.products.find(p => p.id === pid);
    if (!product) return;
    const v = customPrices[pid];
    if (typeof v === 'number') {
      entries.push({ pid, notes: '', price: v, product });
    } else if (typeof v === 'object' && v !== null) {
      Object.keys(v).forEach(nk => {
        if (typeof v[nk] === 'number') {
          // ⭐ (2026-07-09) 저장 키 "_default" 는 UI/저장 로직상 "요청사항 없음" 으로 처리
          const displayNotes = (nk === '_default' || nk === '') ? '' : nk;
          entries.push({ pid, notes: displayNotes, price: v[nk], product });
        }
      });
    }
  });
  entries.sort((a, b) => {
    const n = (a.product.name || '').localeCompare(b.product.name || '', 'ko-KR');
    if (n !== 0) return n;
    return a.notes.localeCompare(b.notes, 'ko-KR');
  });

  let html = '<div style="background:#FAF6F1;border:1px solid var(--line);border-radius:8px;padding:12px 14px;">';
  html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">';
  html += '<b style="color:var(--brand);font-size:13px;">📋 이 거래처 맞춤 단가 (' + entries.length + '개 짝)</b>';
  if (entries.length > 0) {
    html += '<button class="btn sm secondary" onclick="clearAllCustomPrices(\'' + custId + '\')" style="font-size:11px;padding:3px 10px;">전체 해제</button>';
  }
  html += '</div>';
  if (entries.length === 0) {
    html += '<div style="color:var(--muted);font-size:12px;">맞춤 단가 없음 — 인보이스 발행 시 자동 저장됨 (품목+요청사항 짝별).</div>';
  } else {
    html += '<div style="font-size:11px;color:var(--muted);margin-bottom:6px;">같은 품목이라도 요청사항이 다르면 별개 짝 / 단가 칸 수정 후 Enter</div>';
    html += '<table style="width:100%;font-size:12px;">';
    entries.forEach((e, i) => {
      const masterP = e.product.priceKg || 0;
      const notesAttr = e.notes.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
      const notesLbl = e.notes
        ? '<br><small style="color:var(--brand-dark); font-weight:600;">📝 ' + e.notes + '</small>'
        : '<br><small style="color:var(--muted); font-size:10px;">(요청사항 없음 — 기본)</small>';
      html += '<tr style="border-bottom:1px solid var(--line);">';
      html += '<td style="padding:5px 4px;"><b>' + e.product.name + '</b><br><small style="color:var(--muted);">' + (e.product.brand || '') + '</small>' + notesLbl + '</td>';
      html += '<td style="padding:5px 4px;width:120px;">';
      html += '<input type="number" step="0.01" value="' + parseFloat(e.price).toFixed(2) + '" id="cp_' + i + '"';
      html += ' style="width:90px;padding:5px 6px;border:1px solid var(--line);border-radius:4px;text-align:right;font-size:12px;"';
      html += ' onchange="updateCustomPriceFromModal(\'' + custId + '\',\'' + e.pid + '\',\'' + notesAttr + '\',this.value)">';
      html += '<br><small style="color:var(--muted);font-size:10px;">마스터 $' + fmtMoney(masterP) + '</small>';
      html += '</td>';
      html += '<td style="padding:5px 4px;width:50px;text-align:center;">';
      html += '<button onclick="clearOneCustomPrice(\'' + custId + '\',\'' + e.pid + '\',\'' + notesAttr + '\')" title="이 짝의 맞춤 단가 해제"';
      html += ' style="background:none;border:none;cursor:pointer;font-size:14px;color:var(--muted);">✖</button>';
      html += '</td>';
      html += '</tr>';
    });
    html += '</table>';
  }
  html += '</div>';
  return html;
}

window.updateCustomPriceFromModal = function(custId, productId, notes, val) {
  const c = DB.customers.find(x => x.id === custId);
  if (!c) return;
  const p = DB.products.find(x => x.id === productId);
  const masterP = p ? (p.priceKg || 0) : 0;
  const newPrice = parseFloat(val) || 0;
  if (Math.abs(newPrice - masterP) < 0.001 || newPrice <= 0) {
    clearCustomerCustomPrice(c, productId, notes);
  } else {
    setCustomerCustomPrice(c, productId, notes, newPrice);
  }
  saveEntityField('customers', custId, 'customPrices');
  const sec = document.getElementById('customPriceSection');
  if (sec) sec.innerHTML = renderCustomPriceSection(custId);
};

window.clearOneCustomPrice = function(custId, productId, notes) {

function saveCustomer(id, isNew, favs) {
  // 코드 = prefix (대문자 자동) + 자동순번
  const codePrefix = (val('m_code_prefix') || '').trim().toUpperCase();
  const codeNum = (val('m_code_num') || '').trim();
  const combinedCode = codePrefix + codeNum;
  const obj = {
    id, code: combinedCode, name: val('m_name'), contact: val('m_contact'),
    phone: val('m_phone'), email: val('m_email'), terms: val('m_terms'),
    abn: (val('m_abn') || '').trim(),
    address: val('m_address'),
    active: (isNew === 'true' || isNew === true) ? true
      : (DB.customers.find(c => c.id === id) || {}).active !== false,
    favoriteProductIds: typeof favs === 'string' ? JSON.parse(favs) : favs
  };
  if (!obj.name) return alert('거래처명을 입력하세요.');
  if (isNew === 'true' || isNew === true) {
    DB.customers.push(obj);
    // Phase 2 동시성: 트랜잭션으로 안전하게 신규 거래처 추가
    pushEntityToFirebase('customers', obj);
  } else {
    const i = DB.customers.findIndex(c => c.id === id);
    obj.favoriteProductIds = DB.customers[i].favoriteProductIds || [];
    // 즐겨찾기 짝(품목+요청사항)도 보존
    if (Array.isArray(DB.customers[i].favoritePairs)) obj.favoritePairs = DB.customers[i].favoritePairs;
    // Feature 1: 맞춤 단가도 보존 (수정창에서 단가 섹션 안 만져도 유지됨)
    if (DB.customers[i].customPrices) obj.customPrices = DB.customers[i].customPrices;
    DB.customers[i] = obj;
    // Phase 2 동시성: 이 거래처만 부분 업데이트
    saveEntity('customers', id, obj);
  }
  saveLocalDB();
  closeModal(); renderCustomersAdmin();
}
function toggleCustomerBlock(id) {

  saveEntityField('customers', id, 'active');

}

// ⭐ (2026-08-06) 정렬 로직 개정 — 전체 이름 기준 가나다 순 (스트립 없음)
//   앵거스 등 접두어가 자연스럽게 그룹화됨. 화면에 보이는 대로 찾기 쉽게.
//   product.name 은 '[품목한글] [영문/MB]' 패턴. 전체 이름으로 가나다 → 같은 이름은 영문·번호 tie-break.
function _favSortNameAfterPrefix(a, b) {
  const sa = String(a.name || '').trim();
  const sb = String(b.name || '').trim();
  return sa.localeCompare(sb, 'ko-KR', { numeric: true, sensitivity: 'base' });
}

function renderFavChips(custId) {
  const cust = DB.customers.find(c => c.id === custId);
  const chipsEl = document.getElementById('favChips');
  const countEl = document.getElementById('favCount');
  if (!cust || !chipsEl) return;
  const pairs = (Array.isArray(cust.favoritePairs) ? cust.favoritePairs : [])
    .map((pair, idx) => {
      if (!pair || !pair.productId) return null;
      const p = DB.products.find(x => x.id === pair.productId);
      if (!p) return null;
      return { product: p, notes: normalizeFavNotes(pair.notes), idx };
    })
    .filter(Boolean);
  countEl.textContent = pairs.length + '개';
  if (pairs.length === 0) {
    chipsEl.innerHTML = `<span style="color:var(--muted); font-size:13px;">없음 — 아래 품목을 클릭해 추가하세요 / None yet</span>`;
    return;
  }
  // ⭐ (2026-08-01) 정렬 — 카테고리(cut) 우선, 그 안에서 접두어 이후 이름 가나다·알파벳순
  pairs.sort((a, b) => {
    const c = compareCut(a.product.cut, b.product.cut);
    if (c !== 0) return c;
    return _favSortNameAfterPrefix(a.product, b.product);
  });
  // ⭐ (2026-08-01) 노란색 카드 그리드 (핸드폰 즐겨찾기 UI 와 일치, 4열 반응형)
  chipsEl.style.cssText = 'display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:6px; min-height:26px;';
  chipsEl.innerHTML = pairs.map(({product: p, notes, idx}) => {
    const lbl = CUT_DISPLAY[p.cut] || p.cut;
    const notesPart = notes
      ? `<div style="margin-top:4px;"><small style="color:var(--brand-dark); font-weight:600; padding:2px 8px; background:#FFF5D6; border-radius:10px;">📝 ${notes}</small></div>`
      : '';
    return `<div class="fav-admin-card" data-idx="${idx}"
         onclick="editFavPairNotes('${custId}', ${idx})"
         onmouseover="this.style.background='#FFF5D6'"
         onmouseout="this.style.background='#FFFCF3'"
         style="position:relative; cursor:pointer; padding:10px 36px 10px 12px;
                background:#FFFCF3; border:1.5px solid #F0D89A; border-radius:10px;
                text-align:left; line-height:1.4; transition:background 0.15s; min-height:48px;">
      <div>
        <span style="color:var(--brand); font-weight:700; font-size:10px; letter-spacing:0.3px;">${lbl}</span>
        <span style="color:var(--ink); font-weight:700; font-size:13px; margin-left:3px;">${p.name}</span>
      </div>
      ${notesPart}
      <button onclick="event.stopPropagation(); removeFavPairByIdx('${custId}', ${idx})"
        title="이 짝 제거"
        style="position:absolute; top:5px; right:5px; background:transparent; border:none;
               color:#999; font-size:15px; cursor:pointer; padding:3px 7px; border-radius:4px;
               line-height:1; font-weight:700;"
        onmouseover="this.style.background='#FEE'; this.style.color='#C62828';"
        onmouseout="this.style.background='transparent'; this.style.color='#999';"
      >✕</button>
    </div>`;
  }).join('');
}
function toggleFav(custId, prodId) {
  const cust = DB.customers.find(c => c.id === custId);
  if (!cust) return;
  cust.favoritePairs = Array.isArray(cust.favoritePairs) ? cust.favoritePairs : [];
  const hasAny = getFavoriteProductIds(cust).includes(prodId);
  if (hasAny) {
    // 해당 품목의 모든 짝 제거
    removeFavoritePair(cust, prodId);
  } else {
    // 빈 요청사항 짝 1개 추가
    addFavoritePair(cust, prodId, '');
  }
  saveEntityField('customers', custId, 'favoritePairs');
  // Refresh chip panel + the clicked item badge
  renderFavChips(custId);
  const el = document.getElementById('qa_' + prodId);
  if (el) {
    const nowFav = !hasAny;
    el.className = 'qa' + (nowFav ? ' fav' : '');
    const p = DB.products.find(x => x.id === prodId);
    el.textContent = (nowFav ? '⭐ ' : '') + (p ? p.name : prodId);
  }
}
window.editFavPairNotes = function(custId, idx) {
  const cust = DB.customers.find(c => c.id === custId);
  if (!cust || !Array.isArray(cust.favoritePairs)) return;
  const pair = cust.favoritePairs[idx];
  if (!pair) return;
  const newNotes = prompt('품목 요청사항 수정:', pair.notes || '');
  if (newNotes === null) return; // cancel
  const newN = normalizeFavNotes(newNotes);
  if (newN === normalizeFavNotes(pair.notes)) return;
  // Dedup: if another pair already has same product+notes, just remove this one
  const dup = cust.favoritePairs.findIndex((p, i) => i !== idx && p && p.productId === pair.productId && normalizeFavNotes(p.notes) === newN);
  if (dup >= 0) {
    cust.favoritePairs.splice(idx, 1);
  } else {
    pair.notes = newN;
  }
  saveEntityField('customers', custId, 'favoritePairs');
  renderFavChips(custId);
};
window.removeFavPairByIdx = function(custId, idx) {
  const cust = DB.customers.find(c => c.id === custId);
  if (!cust || !Array.isArray(cust.favoritePairs)) return;
  const pair = cust.favoritePairs[idx];
  if (!pair) return;
  cust.favoritePairs.splice(idx, 1);
  saveEntityField('customers', custId, 'favoritePairs');
  renderFavChips(custId);
  // Update item badge if no more pairs left for this product
  if (!getFavoriteProductIds(cust).includes(pair.productId)) {
    const el = document.getElementById('qa_' + pair.productId);
    if (el) {
      el.className = 'qa';
      const p = DB.products.find(x => x.id === pair.productId);
      el.textContent = p ? p.name : pair.productId;
    }
  }
};

function _favParseItem(item) {
  let s = (item || '').replace(/\*\*[^*]+\*\*/g, '').trim();
  const parts = s.split(/\s+\/\s+/);
  const main = parts[0];
  const brands = [];
  for (const bp of parts.slice(1)) {
    let bc = bp.replace(/\([^)]*\)/g, '').replace(/\s*\d+\s*p\b.*$/i, '').trim();
    if (bc && !/^\d/.test(bc)) brands.push(bc);
  }
  const specs = [];
  const sm = main.matchAll(/\(([^)]+)\)/g);
  for (const m of sm) specs.push(m[1]);
  const mainNoParen = main.replace(/\s*\([^)]*\)/g, '').trim();
  let korean = '';
  let i = 0;
  while (i < mainNoParen.length) {
    const c = mainNoParen[i];
    const cc = c.charCodeAt(0);
    if ((cc >= 0xAC00 && cc <= 0xD7A3) || /[\s\d.,]/.test(c)) { korean += c; i++; }
    else break;
  }
  korean = korean.trim();
  const english = mainNoParen.substring(i).trim();
  return { korean: korean, english: english, brands: brands, specs: specs };
}

function _favScoreProduct(parsed, prod) {
  let score = 0;
  const nm = prod.name || '';
  const pbrand = prod.brand || '';
  const nmNorm = nm.replace(/\s+/g, '').toLowerCase();
  const koInName = parsed.korean && nm.indexOf(parsed.korean) >= 0;
  if (koInName) {
    score += nm.startsWith(parsed.korean) ? 4 : 2;
  } else if (parsed.korean) {
    for (const w of parsed.korean.split(/\s+/)) {
      if (w && nm.indexOf(w) >= 0) { score += 1; break; }
    }
  }
  if (parsed.english) {
    for (const w of parsed.english.split(/\s+/)) {
      if (w.length >= 3 && nm.toUpperCase().indexOf(w.toUpperCase()) >= 0) score += 1;
    }
  }
  if (parsed.brands.length && pbrand) {
    for (const b of parsed.brands) {
      if (!b) continue;
      const bn = b.replace(/\s+/g,'').toUpperCase();
      const pn = pbrand.replace(/\s+/g,'').toUpperCase();
      if (bn === pn) { score += 5; break; }
      if (bn.indexOf(pn) >= 0 || pn.indexOf(bn) >= 0) { score += 3; break; }
    }
  } else if (!parsed.brands.length && !pbrand && koInName) {
    score += 1;
  }
  for (const spec of parsed.specs) {
    const sn = spec.replace(/\s+/g,'').toLowerCase();
    if (sn && nmNorm.indexOf(sn) >= 0) score += 3;
  }
  return score;
}

function favFindProductMatches(itemStr, limit) {
  limit = limit || 6;
  const parsed = _favParseItem(itemStr);
  const cands = [];
  for (const p of DB.products) {
    if (!p.active) continue;
    const s = _favScoreProduct(parsed, p);
    if (s >= 3) cands.push({ score: s, id: p.id, name: p.name, brand: p.brand || '' });
  }
  cands.sort(function(a,b){ return b.score - a.score; });
  return cands.slice(0, limit);
}

function favFindCustomerMatches(excelName, limit) {
  limit = limit || 5;
  const target = (excelName || '').toLowerCase().replace(/\s+/g, '');
  if (!target) return [];
  const cands = [];
  for (const c of DB.customers) {
    if (c.active === false) continue;
    const nm = (c.name || '').toLowerCase().replace(/\s+/g, '');
    const code = (c.code || '').toLowerCase().replace(/\s+/g, '');
    let score = 0;
    if (nm === target || code === target) score = 100;
    else if (nm.startsWith(target) || code.startsWith(target)) score = 50;
    else if (target.startsWith(nm) && nm.length >= 2) score = 40;
    else if (nm.indexOf(target) >= 0) score = 30;
    else if (target.indexOf(nm) >= 0 && nm.length >= 2) score = 20;
    if (score > 0) cands.push({ score: score, id: c.id, name: c.name, code: c.code });
  }
  cands.sort(function(a,b){ return b.score - a.score; });
  return cands.slice(0, limit);
}

  FAV_IMPORT_STATE = buildFavImportState();
  renderFavImportModal();

function buildFavImportState() {
  const state = { customers: [], totals: { custAuto:0, custNone:0, custSaved:0, itemAuto:0, itemAmbi:0, itemNone:0 } };
  const savedMap = _favsCustNameToId();
  for (const excelName in ATM_FAVS_IMPORT_DATA) {
    const items = ATM_FAVS_IMPORT_DATA[excelName];
    const custCands = favFindCustomerMatches(excelName, 8);
    // Priority 1: saved mapping (from 거래처명 매핑 도구)
    // Priority 2: top fuzzy candidate with score >= 30
    let selectedCustId = '';
    const saved = savedMap[excelName];
    if (saved && DB.customers.find(function(c){return c.id === saved;})) {
      selectedCustId = saved;
      state.totals.custSaved++;
    } else if (custCands[0] && custCands[0].score >= 30) {
      selectedCustId = custCands[0].id;
    }
    if (selectedCustId) state.totals.custAuto++; else state.totals.custNone++;
    const savedItemMap = _favsItemNameToId();
    const itemRows = items.map(function(it) {
      const cands = favFindProductMatches(it.item, 6);
      let status = 'none';
      let selectedProdId = '';
      // Priority 1: saved item mapping (from 품목명 매핑 도구)
      // Priority 2: top fuzzy candidate
      const savedProd = savedItemMap[it.item];
      if (savedProd && DB.products.find(function(p){return p.id === savedProd;})) {
        selectedProdId = savedProd;
        status = 'auto';
      } else if (cands.length === 0) {
        status = 'none';
      } else if (cands[0].score >= 7) {
        status = 'auto'; selectedProdId = cands[0].id;
      } else {
        status = 'ambi'; selectedProdId = cands[0].id;
      }
      if (status === 'auto') state.totals.itemAuto++;
      else if (status === 'ambi') state.totals.itemAmbi++;
      else state.totals.itemNone++;
      return { item: it.item, count: it.count, candidates: cands,
               selectedProdId: selectedProdId, status: status, apply: status !== 'none' };
    });
    state.customers.push({ excelName: excelName, candidates: custCands,
                          selectedCustId: selectedCustId, items: itemRows, expanded: false });
  }
  return state;
}

function applyFavImport() {
  const s = FAV_IMPORT_STATE;
  if (!s) return;
  let custAffected = 0, itemsAdded = 0, itemsSkipped = 0;
  for (const cust of s.customers) {
    if (!cust.selectedCustId) {
      itemsSkipped += cust.items.filter(function(it){return it.apply;}).length;
      continue;
    }
    const dbCust = DB.customers.find(function(x){return x.id===cust.selectedCustId;});
    if (!dbCust) continue;
    dbCust.favoritePairs = Array.isArray(dbCust.favoritePairs) ? dbCust.favoritePairs : [];
    let added = 0;
    for (const it of cust.items) {
      if (!it.apply || !it.selectedProdId) continue;
      // 일괄 임포트는 빈 요청사항 짝으로 추가
      if (addFavoritePair(dbCust, it.selectedProdId, '')) added++;
    }
    if (added > 0) {
      custAffected++;
      itemsAdded += added;
      try { saveEntityField('customers', dbCust.id, 'favoritePairs'); } catch(e) { console.warn(e); }
    }
  }
  closeFavImportModal();
  alert('✅ 일괄 적용 완료\n\n  · 거래처 ' + custAffected + '개 업데이트\n  · 즐겨찾기 ' + itemsAdded + '개 추가\n  · 거래처 미매칭 스킵: ' + itemsSkipped + '개');
  // Refresh the favorites admin view if currently on it
  if (location.hash.indexOf('#admin') === 0) {
    const tab = new URL(location.href.replace('#','?')).searchParams.get('tab');
    if (tab === 'favorites') location.reload();
  }
}

  FAV_IMPORT_STATE = null;

      candidates: cands,

    const isDup = e.selectedId && dupCount[e.selectedId] > 1;

    return true;

// =========================================================================
//  ITEM NAME MAPPING TOOL  (Excel 품목명 ↔ 시스템 product 매핑)
//  매핑은 DB.settings.favsItemMap 에 저장되며 일괄 import 시 자동 사용됨.
//  엑셀 중복 품목은 dedupe — 동일 문자열은 한 행으로 모임 (사용 거래처 수 표시)
//
//  ⚠️ Firebase 키 제약: '.', '#', '$', '/', '[', ']' 사용 불가
//  → favsItemMap 키로 품목 id를 사용 (id 없으면 안전 치환 키)
//  → 값은 엑셀 품목명 원문 (역방향 조회용)
//  → 읽기는 _favsItemNameToId() 가 양쪽 포맷 모두 호환
// =========================================================================
const _FB_BAD_KEY_RE = /[.#$/\[\]]/g;
function _favSafeKey(s) {
  return (s == null ? '' : String(s)).replace(_FB_BAD_KEY_RE, '_');
}
// 저장 형식 양쪽 모두 지원하는 역방향 조회:
//   신규: { productId: excelName, ... }
//   구버전: { excelName: productId, ... }
//   폴백: { safeName: productId, ... }  (id가 없는 경우)
// 반환: { excelName: productId } — 룩업용
function _favsItemNameToId() {
  const raw = (DB.settings && DB.settings.favsItemMap) || {};
  const result = {};
  if (!Array.isArray(DB.products)) return result;
  const idSet = new Set(DB.products.map(p => p.id));
  for (const k in raw) {
    const v = raw[k];
    if (typeof v !== 'string' || !v) continue;
    if (idSet.has(k)) {
      // 신규 포맷: k=productId, v=excelName
      result[v] = k;
    } else if (idSet.has(v)) {
      // 구버전 포맷: k=excelName, v=productId
      result[k] = v;
    }
    // 어느 쪽도 아니면 skip (orphan)
  }
  return result;
}
// favsCustMap 동일 패턴 — Firebase 키 제약 우회
//   신규: { customerId: excelName, ... }
//   구버전: { excelName: customerId, ... }
// 반환: { excelName: customerId } — 룩업용
function _favsCustNameToId() {
  const raw = (DB.settings && DB.settings.favsCustMap) || {};
  const result = {};
  if (!Array.isArray(DB.customers)) return result;
  const idSet = new Set(DB.customers.map(c => c.id));
  for (const k in raw) {
    const v = raw[k];
    if (typeof v !== 'string' || !v) continue;
    if (idSet.has(k)) {
      // 신규 포맷: k=customerId, v=excelName
      result[v] = k;
    } else if (idSet.has(v)) {
      // 구버전 포맷: k=excelName, v=customerId
      result[k] = v;
    }
  }
  return result;
}
let ITEM_MAP_STATE = null;

function openItemMappingTool() {
  // Build dedup'd unique items list (excelItemStr → { count, customers })
  const uniq = {};
  for (const excelName in ATM_FAVS_IMPORT_DATA) {
    for (const it of ATM_FAVS_IMPORT_DATA[excelName]) {
      const key = it.item;
      if (!uniq[key]) uniq[key] = { item: key, custCount: 0, totalCount: 0, customers: [] };
      uniq[key].custCount++;
      uniq[key].totalCount += (it.count || 0);
      uniq[key].customers.push(excelName);
    }
  }
  const savedMap = _favsItemNameToId();
  const entries = Object.values(uniq).map(function(u) {
    const cands = favFindProductMatches(u.item, 8);
    const saved = savedMap[u.item];
    let selected = '';
    if (saved && DB.products.find(function(p){return p.id === saved;})) {
      selected = saved;
    } else if (cands[0] && cands[0].score >= 7) {
      selected = cands[0].id;
    }
    return { item: u.item, custCount: u.custCount, totalCount: u.totalCount,
             customers: u.customers, candidates: cands, selectedId: selected };
  });
  // Sort by usage (custCount desc, totalCount desc) so frequent items come first
  entries.sort(function(a,b){
    if (b.custCount !== a.custCount) return b.custCount - a.custCount;
    return b.totalCount - a.totalCount;
  });
  ITEM_MAP_STATE = { entries: entries, filter: 'all', search: '' };
  renderItemMappingModal();
}

//   - 일치 → 초록 카드 즉시 표시 (positive feedback 빠르게)
//   - 불일치 → 2.5초 후 빨간 안내 (typing 중 계속 붉은 메시지 뜨는 것 방지)
//   - 초록 카드 클릭 = 확인 후 주문 (별도 버튼 없음)
let _liveCheckTimer = null;
window.liveCheckCode = function() {
  const inp = document.getElementById('entryCode');
  const div = document.getElementById('liveResult');
  if (!inp || !div) return;
  const raw = (inp.value || '').trim();
  // 이전 타이머 취소 (계속 타이핑 중이면 안내 안 뜸)
  if (_liveCheckTimer) { clearTimeout(_liveCheckTimer); _liveCheckTimer = null; }
  if (!raw) { div.innerHTML = ''; return; }
  const match = findCustomerByCode(raw);
  // 매치 성공 → 즉시 초록 카드 (클릭 = 진입)
  if (match) {
    if (match.active === false) {
      div.innerHTML = '<div style="padding:14px;background:#FFEBEE;border:2px solid #E53935;border-radius:8px;margin-top:8px;text-align:center;">'
        + '<div style="font-size:18px;font-weight:700;color:#B71C1C;">⛔ 접근 차단됨 / Access Blocked</div>'
        + '<div style="font-size:12px;color:#888;margin-top:6px;">문의 / Inquiry: ' + ((DB.company && DB.company.phone) || 'ATM 사무실') + '</div>'
        + '</div>';
      return;
    }
    const nm = (match.name || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    div.innerHTML = '<div onclick="submitEntryCode()" '
      + 'onmouseover="this.style.background=\'#C8E6C9\'" '
      + 'onmouseout="this.style.background=\'#E8F5E9\'" '
      + 'style="cursor:pointer; padding:20px 14px;background:#E8F5E9;border:2px solid #43A047;border-radius:8px;margin-top:8px;text-align:center;transition:background 0.15s;">'
      + '<div style="font-size:20px;font-weight:700;color:#1B5E20;">✅ ' + nm + '</div>'
      + '<div style="font-size:12px;color:#43A047;margin-top:6px;">아래 확인 버튼 또는 Enter 를 누르세요 / Tap here or press Enter</div>'
      + '</div>';
    return;
  }
  // 매치 실패 → 화면 클리어 + 2.5초 debounce 후 빨간 안내
  div.innerHTML = '';
  _liveCheckTimer = setTimeout(() => {
    const cur = (document.getElementById('entryCode') || {}).value || '';
    if ((cur.trim()) !== raw) return;   // 사용자가 계속 입력 중 → 안내 안 뜸
    if (!cur.trim()) return;
    if (findCustomerByCode(cur.trim())) return;  // 그새 매치되면 스킵
    const d = document.getElementById('liveResult');
    if (d) {
      d.innerHTML = '<div style="padding:10px 14px;background:#FFF3E0;border-left:4px solid #FF9800;border-radius:6px;font-size:13px;color:#BF6900;margin-top:8px;">'
        + '❌ 일치하는 코드 없음 / No matching code<br>'
        + '<span style="font-size:11px; opacity:0.85;">다시 확인해 주세요 / Please check again.</span>'
        + '</div>';
    }
  }, 2500);
};

function normalizeSearch(s) {
  // 1. 소문자 + 공백 제거
  let n = (s || '').toLowerCase().replace(/\s+/g, '');
  // 2. 한/영 동의어 치환 (양방향)
  const pairs = [
    ['bbq','바베큐'], ['bar','바'], ['chicken','치킨'], ['house','하우스'],
    ['garden','가든'], ['mart','마트'], ['market','마켓'], ['king','킹'],
    ['star','스타'], ['cafe','카페'], ['coffee','커피'], ['korean','한국'],
    ['restaurant','레스토랑'], ['shop','샵'], ['food','푸드'], ['fresh','프레쉬'],
    ['plus','플러스'], ['super','슈퍼'], ['happy','해피'], ['big','빅']
  ];
  // 영→한, 한→영 두 버전 모두 생성
  let variants = new Set([n]);
  for (const [en, ko] of pairs) {
    for (const v of [...variants]) {
      if (v.includes(en)) variants.add(v.replace(new RegExp(en,'g'), ko));
      if (v.includes(ko)) variants.add(v.replace(new RegExp(ko,'g'), en));
    }
  }
  return variants;
}

function findCustomerMatch(input) {
  const inpVariants = normalizeSearch(input);
  // 1순위: 코드 일치
  let m = DB.customers.find(c => {
    const code = (c.code || '').toLowerCase().replace(/\s+/g, '');
    return [...inpVariants].some(v => v === code);
  });
  if (m) return m;
  // 2순위: 상호명 완전 일치 (공백·대소문자·한영 무시)
  m = DB.customers.find(c => {
    const nameVariants = normalizeSearch(c.name);
    return [...inpVariants].some(iv => [...nameVariants].some(nv => iv === nv));
  });
  if (m) return m;
  // 3순위: 포함 검색 (입력값이 상호명에 포함되거나 상호명이 입력값에 포함)
  m = DB.customers.find(c => {
    const nameVariants = normalizeSearch(c.name);
    return [...inpVariants].some(iv =>
      [...nameVariants].some(nv => nv.includes(iv) || iv.includes(nv))
    );
  });
  return m || null;
}

var _enterMatchId = null;

function liveSearchCustomer() {
  var inp = document.getElementById('entryCode');
  var div = document.getElementById('liveResult');
  if (!inp || !div) return;
  var raw = (inp.value || '').trim();
  _enterMatchId = null;

  if (!raw) { div.innerHTML = ''; return; }

  // 공백/대소문자 무시 매칭 (예: "강남 정육점" === "강남정육점")
  var q = raw.toLowerCase().replace(/\s+/g, '');
  var matches = DB.customers.filter(function(c) {
    var nm = (c.name    || '').toLowerCase().replace(/\s+/g, '');
    var cd = (c.code    || '').toLowerCase().replace(/\s+/g, '');
    var ct = (c.contact || '').toLowerCase().replace(/\s+/g, '');
    return nm.indexOf(q) !== -1 || cd.indexOf(q) !== -1 || ct.indexOf(q) !== -1;
  });

  if (matches.length === 0) {
    div.innerHTML = '<div style="padding:10px 14px;background:#FFF3E0;border-left:4px solid #FF9800;border-radius:6px;font-size:13px;color:#BF6900;margin-top:8px;">'

  } else if (matches.length === 1) {
    var matched = matches[0];
    var nm = (matched.name || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    if (matched.active === false) {
      // 차단된 거래처

        + '</div>';
    } else {
      _enterMatchId = matched.id;
      div.innerHTML = '<div onclick="selectEnterMatch()" style="'
        + 'padding:16px 14px;background:#E8F5E9;border:2px solid #43A047;border-radius:8px;'
        + 'margin-top:8px;text-align:center;cursor:pointer;'
        + 'transition:background 0.15s;" '
        + 'onmouseover="this.style.background=\'#C8E6C9\'" '
        + 'onmouseout="this.style.background=\'#E8F5E9\'">'
        + '<div style="font-size:20px;font-weight:700;color:#1B5E20;letter-spacing:0.3px;">✅&nbsp;' + nm + '</div>'
        + '<div style="font-size:12px;color:#43A047;margin-top:6px;">👆 여기를 클릭하거나 아래 확인 버튼을 누르세요</div>'
        + '</div>';
    }

  } else {
    div.innerHTML = '<div style="padding:10px 14px;background:#E3F2FD;border-left:4px solid #2196F3;border-radius:6px;font-size:13px;color:#1565C0;margin-top:8px;">'
      + '🔍&nbsp;<b>' + matches.length + '개</b> 거래처 일치 — 상호명을 더 입력하면 좁혀집니다</div>';
  }
}

function selectEnterMatch() {
  if (!_enterMatchId) return;
  var c = DB.customers.find(function(x) { return x.id === _enterMatchId; });
  if (c) {
    var inp = document.getElementById('entryCode');
    if (inp) inp.value = c.name;
    submitEntry();
  }
}

function submitEntry() {
  const raw = (val('entryCode') || '').trim();
  if (!raw) return alert('거래처 코드 또는 상호명을 입력해 주세요.\nPlease enter your customer code or store name.');
  const match = findCustomerMatch(raw);
  if (!match) {
    return alert('일치하는 거래처를 찾을 수 없습니다.\nNo matching customer found.\n\n' +
      '· 띄어쓰기, 대소문자는 달라도 괜찮습니다.\n' +
      '· 문의: ' + (DB.company.phone || 'ATM 사무실'));
  }
  if (match.active === false) {
    return alert('⛔ 주문 접근이 차단된 거래처입니다.\nOrder access has been suspended.\n\n' +
      '문의: ' + (DB.company.phone || 'ATM 사무실로 연락 주세요'));
  }
  setCustomerMode(match.id);
  location.hash = '#order?c=' + match.id;
}

let CART = []; // per-session order draft

// ⭐ (2026-07-27) 장바구니 자동 저장·복원 — 다른 화면 갔다 와도 CART 유지.
//   조건: 같은 거래처(custId), 24시간 이내, 같은 브라우저.
//   주문 제출 성공 시 자동 삭제. 다른 거래처로 바꾸면 이전 것 폐기.
const CART_DRAFT_KEY = 'atm_cart_draft_v1';
const CART_DRAFT_TTL_MS = 24 * 60 * 60 * 1000;
function saveCartDraft(custId, extras) {
  try {
    if (!custId) return;
    const draft = {
      custId: custId,
      cart: CART,
      deliveryNotes: (extras && typeof extras.deliveryNotes === 'string') ? extras.deliveryNotes : (function(){
        const el = document.getElementById('deliveryNotes');
        return el ? el.value : '';
      })(),
      savedAt: Date.now()
    };
    localStorage.setItem(CART_DRAFT_KEY, JSON.stringify(draft));
  } catch(e) { console.warn('cart draft save failed:', e); }
}
function loadCartDraft(custId) {
  try {
    const raw = localStorage.getItem(CART_DRAFT_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    if (!d || !d.custId || d.custId !== custId) return null;
    if (!d.savedAt || (Date.now() - d.savedAt) > CART_DRAFT_TTL_MS) {
      localStorage.removeItem(CART_DRAFT_KEY);
      return null;
    }
    return d;
  } catch(e) { return null; }
}
function clearCartDraft() {
  try { localStorage.removeItem(CART_DRAFT_KEY); } catch(_){}
}

function renderFavQuick(cust) {
  const div = document.getElementById('favList');
  const card = document.getElementById('favCard');
  // 짝(productId + notes) 단위로 카드 분리. 유효한 활성 품목만.
  const pairs = (Array.isArray(cust.favoritePairs) ? cust.favoritePairs : [])
    .map(pair => {
      if (!pair || !pair.productId) return null;
      const p = DB.products.find(x => x.id === pair.productId);
      if (!p || !p.active) return null;
      return { product: p, notes: normalizeFavNotes(pair.notes) };
    })
    .filter(Boolean);
  // 분류 우선순위 (와규 → 소고기 → 돼지고기 → 작업육 → 가공육 → 오리 → 양고기 → 공산품)
  // 같은 분류 안에서는 품목명 가나다순, 그 다음 요청사항순.
  pairs.sort((a, b) => {
    const c = compareCut(a.product.cut, b.product.cut);
    if (c !== 0) return c;
    const n = (a.product.name || '').localeCompare(b.product.name || '', 'ko-KR');
    if (n !== 0) return n;
    return a.notes.localeCompare(b.notes, 'ko-KR');
  });
  if (card) card.style.display = '';  // always show the card
  if (pairs.length === 0) {
    div.innerHTML = `<div style="color:var(--muted); font-size:13px; padding:6px 4px;">
      주문하면 자동으로 여기에 추가됩니다. / Items you order will appear here automatically.
    </div>`;
    return;
  }
  // ⭐ (2026-07-30) 옵션 B — 카드 전체 담기
  //   카드 어디를 눌러도 담김 (60~72px 터치 영역)
  //   담긴 순간 초록 ✓ 팝 + 배경 초록 반짝 → 확실한 시각 피드백
  //   담긴 개수 배지 표시 (한 카드 여러 번 담기 가능)
  //   삭제는 우상단 작은 [✕] 버튼만 (실수 방지)
  const currentCartCount = (pid, notesN) => CART.filter(c =>
    c.productId === pid && normalizeFavNotes(c.notes || '') === notesN
  ).length;
  // ⭐ (2026-08-10) 컴팩트 즐겨찾기 — 요청사항 없으면 1줄, 있으면 2줄
  //   카탈로그 스타일과 통일 · 화면 공간 절반 절약
  div.innerHTML = pairs.map(({product: p, notes}) => {
    const cutLabel = CUT_DISPLAY[p.cut] || p.cut;
    const notesAttr = notes.replace(/'/g, '&#39;').replace(/"/g, '&quot;');
    const hasNotes = !!notes;
    const notesPart = hasNotes
      ? `<div style="margin-top:2px; padding-left:0;"><small style="color:var(--brand-dark); font-weight:600; padding:1px 6px; background:#FFF5D6; border-radius:8px; font-size:10px;">📝 ${escapeHtmlSimple(notes)}</small></div>`
      : '';
    const inCart = currentCartCount(p.id, notes);
    const badgeHtml = inCart > 0
      ? `<span style="display:inline-block; background:#2E7D32; color:#fff; font-size:10px; font-weight:700; padding:1px 6px; border-radius:8px; margin-left:4px; vertical-align:middle;">🛒 ${inCart}</span>`
      : '';
    return `<div class="fav-card" data-pid="${p.id}" data-notes="${notesAttr}"
         onclick="favCardAdd(this)"
         style="position:relative; cursor:pointer; padding:6px 34px 6px 10px; margin-bottom:3px;
                background:#FFFCF3; border:0.5px solid #F0D89A; border-radius:5px;
                text-align:left; line-height:1.4;
                transition:background 0.15s;"
         onmouseover="this.style.background='#FFF5D6'"
         onmouseout="this.style.background='#FFFCF3'">
      <div style="display:flex; align-items:center; gap:4px; min-height:22px;">
        <span style="color:var(--brand); font-weight:700; font-size:10px; letter-spacing:0.3px; white-space:nowrap;">${cutLabel}</span>
        <span style="color:var(--ink); font-weight:600; font-size:13px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtmlSimple(p.name)}</span>
        ${badgeHtml}
      </div>
      ${notesPart}
      <button onclick="event.stopPropagation(); favCardRemove(this)"
        title="즐겨찾기에서 제거"
        style="position:absolute; top:2px; right:2px; background:transparent; border:none;
               color:#999; font-size:13px; cursor:pointer; padding:4px 6px; border-radius:3px;
               line-height:1;"
        onmouseover="this.style.background='#FEE'; this.style.color='#C62828';"
        onmouseout="this.style.background='transparent'; this.style.color='#999';"
      >✕</button>
    </div>`;
  }).join('');
}

// ⭐ (2026-07-30) 옵션 B — 카드 클릭 시 담기 + 시각 피드백
window.favCardAdd = function(cardEl) {
  const pid = cardEl.getAttribute('data-pid');
  const notes = cardEl.getAttribute('data-notes') || '';
  if (!pid) return;
  addToCart(pid, notes);
  // 배경 초록 반짝 (200ms) + 초록 원 ✓ 아이콘 팝 (900ms)
  const origBg = cardEl.style.background;
  const origBorder = cardEl.style.borderColor;
  cardEl.style.background = '#C8E6C9';
  cardEl.style.borderColor = '#2E7D32';
  setTimeout(() => {
    cardEl.style.background = origBg;
    cardEl.style.borderColor = origBorder;
  }, 250);
  // 초록 원 ✓ 팝
  const check = document.createElement('div');
  check.style.cssText =
    'position:absolute; top:50%; right:50px; transform:translate(0,-50%); ' +
    'width:26px; height:26px; border-radius:50%; background:#2E7D32; color:#fff; ' +
    'font-size:16px; font-weight:900; display:flex; align-items:center; justify-content:center; ' +
    'box-shadow:0 3px 10px rgba(46,125,50,0.5); pointer-events:none; z-index:10; ' +
    'animation: favCheckPop 0.9s ease-out forwards;';
  check.textContent = '✓';
  cardEl.appendChild(check);
  // 애니메이션 끝난 후 fav 리스트 재렌더 → 배지 카운트 갱신 (애니메이션 도중 카드 파괴 방지)
  setTimeout(() => {
    if (check.parentNode) check.parentNode.removeChild(check);
    const custMatch = location.hash.match(/#order\?c=([^&]+)/);
    if (custMatch) {
      const cust = DB.customers.find(c => c.id === custMatch[1]);
      if (cust) renderFavQuick(cust);
    }
  }, 950);
};

window.favCardRemove = function(btnEl) {
  const cardEl = btnEl.closest('.fav-card');
  if (!cardEl) return;
  const pid = cardEl.getAttribute('data-pid');
  const notes = cardEl.getAttribute('data-notes') || '';
  const custMatch = location.hash.match(/#order\?c=([^&]+)/);
  if (!custMatch) return;
  const cust = DB.customers.find(c => c.id === custMatch[1]);
  if (!cust || !Array.isArray(cust.favoritePairs)) return;
  const targetNotes = normalizeFavNotes(notes);
  const before = cust.favoritePairs.length;
  cust.favoritePairs = cust.favoritePairs.filter(pair => {
    if (!pair || pair.productId !== pid) return true;
    if (normalizeFavNotes(pair.notes || '') !== targetNotes) return true;
    return false;
  });
  if (cust.favoritePairs.length === before) return;
  try { saveEntityField('customers', cust.id, 'favoritePairs'); } catch(e) { console.warn(e); }
  renderFavQuick(cust);
  if (typeof showToast === 'function') showToast('즐겨찾기에서 제거됨');
};
function renderCatalog(q, custId) {
  const div = document.getElementById('catalog');
  const filt = DB.products.filter(p => p.active && (!q || (p.name+' '+p.brand+' '+p.cut).toLowerCase().includes(q.toLowerCase())));
  const cuts = [...new Set(filt.map(p => p.cut))];
  // ⭐ (2026-08-04) 카테고리 정렬 (기존 compareCut 사용) → 카테고리 순서 유지
  cuts.sort((a, b) => compareCut(a, b));
  const cust = custId ? DB.customers.find(c => c.id === custId) : null;
  const isStaff = STAFF_UNLOCKED && !CUSTOMER_MODE;
  div.innerHTML = cuts.map(cut => `
    <h4 style="margin-top:14px; margin-bottom:4px; color:var(--brand); font-size:12px; text-transform:uppercase; letter-spacing:1px; border-bottom:1px solid var(--line); padding-bottom:4px;">${CUT_DISPLAY[cut] || cut}</h4>
    <div>
      ${filt.filter(p => p.cut === cut).slice().sort(_favSortNameAfterPrefix).map(p => {
        const isFav = cust ? getFavoriteProductIds(cust).includes(p.id) : false;
        const favBtn = (isStaff && custId)
          ? `<button onclick="event.stopPropagation(); toggleCatalogFav('${custId}','${p.id}',this)"
               title="${isFav ? 'Remove from Favourites / 자주 주문에서 제거' : 'Add to Favourites / 자주 주문에 추가'}"
               style="background:none; border:none; cursor:pointer; font-size:16px; padding:0 4px 0 6px; color:${isFav?'#F0B400':'#bbb'}; vertical-align:middle;"
             >${isFav ? '⭐' : '☆'}</button>`
          : '';
        const cutLabel = CUT_DISPLAY[p.cut] || p.cut;
        return `<div onclick="addToCart('${p.id}')"
              onmouseover="this.style.background='#F5E8DD'"
              onmouseout="this.style.background='transparent'"
              style="cursor:pointer; padding:3px 4px; font-size:14px; color:var(--ink); text-align:left; line-height:1.5; display:flex; align-items:center; justify-content:space-between;">
          <span>
            <span style="color:var(--brand); font-weight:600; font-size:11px; letter-spacing:0.3px;">${cutLabel}</span>
            <span style="color:var(--ink); font-weight:700;"> ${p.name}</span>
            ${p.brand ? `<span style="font-weight:400; color:var(--muted); font-size:12px;"> · ${p.brand}</span>` : ''}
          </span>
          ${favBtn}
        </div>`;
      }).join('')}
    </div>
  `).join('') || `<div class="empty">검색 결과 없음</div>`;
}
function addToCart(prodId, notes) {
  const p = DB.products.find(x => x.id === prodId);
  if (!p) return;
  CART.push({
    productId: prodId, unit: '박스', quantity: null, actualWeightKg: null,
    notes: (notes == null ? '' : String(notes))
  });
  // ⭐ (2026-08-10) B-2 방식: 담자마자 편집 모달 자동 오픈 → 수량 즉시 입력
  //   인덱스를 setTimeout 밖에서 캡처 (연속 담기 시 마지막 인덱스로 덮어쓰는 버그 방지)
  //   거래처/사무원/직원 모두 자동 모달 (컴팩트 카트는 인라인 수량 입력 없음)
  const _capturedIdx = CART.length - 1;
  renderCart();
  _autoSaveCurrentCartDraft();
  // 카트 스크롤: 9개 이상일 때 최신 항목이 보이도록 자동으로 하단으로 스크롤
  try {
    const _cartEl = document.getElementById('cart');
    if (_cartEl && _cartEl.scrollHeight > _cartEl.clientHeight) {
      _cartEl.scrollTop = _cartEl.scrollHeight;
    }
  } catch(_){}
  setTimeout(function(){
    if (typeof openCartEditModal === 'function') openCartEditModal(_capturedIdx);
  }, 80);
  // ⭐ (2026-07-28) 클릭 시각 피드백 — 클릭한 요소 우측에 초록 ✓ 아이콘 순간 표시 (900ms)
  try {
    const el = (window.event && window.event.currentTarget) || null;
    if (el) {
      // 이미 있는 체크 아이콘 제거
      const old = el.querySelector('.atm-add-check');
      if (old) old.remove();
      const check = document.createElement('span');
      check.className = 'atm-add-check';
      check.textContent = '✓';
      check.style.cssText =
        'position:absolute; right:12px; top:50%; transform:translateY(-50%) scale(0.5); ' +
        'color:#fff; background:#2E7D32; ' +
        'width:22px; height:22px; border-radius:50%; ' +
        'display:flex; align-items:center; justify-content:center; ' +
        'font-size:14px; font-weight:900; ' +
        'box-shadow:0 2px 6px rgba(46,125,50,0.4); ' +
        'opacity:0; transition: opacity 120ms ease-out, transform 200ms cubic-bezier(0.34,1.56,0.64,1); ' +
        'pointer-events:none; z-index:10;';
      // 부모 element position 이 static이면 relative 로 임시 세팅
      const origPos = el.style.position;
      const computed = window.getComputedStyle(el).position;
      if (computed === 'static') el.style.position = 'relative';
      el.appendChild(check);
      // 다음 프레임에 애니메이션 시작
      requestAnimationFrame(function(){
        check.style.opacity = '1';
        check.style.transform = 'translateY(-50%) scale(1)';
      });
      // 900ms 후 페이드 아웃 + 제거
      setTimeout(function(){
        check.style.opacity = '0';
        check.style.transform = 'translateY(-50%) scale(0.7)';
        setTimeout(function(){
          if (check.parentNode) check.parentNode.removeChild(check);
          if (computed === 'static') el.style.position = origPos || '';
        }, 200);
      }, 700);
    }
  } catch(_){}
}

// Staff: toggle a product into/out of the current customer's favourites from the catalogue
// 카탈로그에는 요청사항 컨텍스트가 없으므로 빈 notes 짝으로 추가/모든 짝 제거.
function toggleCatalogFav(custId, prodId, btn) {
  const cust = DB.customers.find(c => c.id === custId);
  if (!cust) return;
  cust.favoritePairs = Array.isArray(cust.favoritePairs) ? cust.favoritePairs : [];
  const isFav = getFavoriteProductIds(cust).includes(prodId);
  if (isFav) {
    // Remove ALL pairs for this product
    removeFavoritePair(cust, prodId);
    btn.textContent = '☆';
    btn.title = 'Add to Favourites / 자주 주문에 추가';
    btn.style.color = '#aaa';
  } else {
    addFavoritePair(cust, prodId, '');
    btn.textContent = '⭐';
    btn.title = 'Remove from Favourites / 자주 주문에서 제거';
    btn.style.color = '#F0B400';
  }
  // Phase 2 동시성: 이 거래처의 favorites 만 부분 업데이트
  saveEntityField('customers', custId, 'favoritePairs');
  // Refresh favourites panel without re-rendering whole page
  const custObj = DB.customers.find(c => c.id === custId);
  if (custObj) renderFavQuick(custObj);
}
// ⭐ (2026-08-10) 컴팩트 카트 (B-2) — 1줄 표시 · 탭하면 [수정][삭제] 나타남 · 편집 모달
//   기본은 매우 미니멀 (품목명·수량·단위만) → 카탈로그 시야 최대 확보
//   행 탭 → 우측에 [✎ 수정] [🗑 삭제] 부드럽게 나타남
//   [수정] → openCartEditModal(idx) → 모달로 수량/단위/요청사항 편집
//   [삭제] → 확인 → CART.splice → 재렌더

window._expandedCartIdx = null;

function renderCart() {
  const div = document.getElementById('cart');
  if (CART.length === 0) {
    div.innerHTML = `<div class="empty" style="padding:12px 8px; font-size:12px;"><div class="icon" style="font-size:22px;">🛒</div>아래에서 품목을 선택해 추가하세요.<br><small style="font-weight:400; opacity:0.7;">Select items below to add</small></div>`;
  } else {
    const unitDisp = { '박스':'박스', '팩':'팩', '작업중량':'kg' };
    div.innerHTML = CART.map((item, idx) => {
      const p = DB.products.find(x => x.id === item.productId);
      const pName = p ? p.name : '(품목없음)';
      const qtyStr = (item.quantity == null || item.quantity === '' || isNaN(item.quantity))
        ? '<span style="color:var(--warn); font-weight:600;">수량?</span>'
        : parseFloat(item.quantity) + ' ' + (unitDisp[item.unit] || '박스');
      const notesTag = item.notes ? ' <small style="color:var(--brand-dark); background:#FFF5D6; padding:1px 5px; border-radius:6px; font-size:10px;">📝 ' + escapeHtmlSimple(item.notes) + '</small>' : '';
      const isExpanded = window._expandedCartIdx === idx;
      const revealHtml = isExpanded
        ? `<button class="cart-edit-btn" onclick="event.stopPropagation(); openCartEditModal(${idx})" style="background:#5C0F0F; color:#fff; border:none; border-radius:4px; padding:4px 8px; font-size:11px; font-weight:600; margin-right:4px;">✎ 수정</button>
           <button class="cart-del-btn" onclick="event.stopPropagation(); confirmCartDelete(${idx})" style="background:#C62828; color:#fff; border:none; border-radius:4px; padding:4px 8px; font-size:11px; font-weight:600;">🗑 삭제</button>`
        : `<span style="color:var(--muted); font-size:11px;">탭</span>`;
      const rowBg = isExpanded ? '#FFF3C4' : '#FFFCF3';
      const rowBorder = isExpanded ? '#E8A317' : '#F0D89A';
      return `
        <div class="cart-row-compact"
             onclick="event.stopPropagation(); toggleCartRowExpand(${idx})"
             style="display:flex; align-items:center; gap:6px; padding:6px 8px; background:${rowBg}; border:0.5px solid ${rowBorder}; border-radius:5px; margin-bottom:3px; cursor:pointer; min-height:28px; transition:background 0.12s;">
          <span style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:500; font-size:13px; color:var(--ink);">${escapeHtmlSimple(pName)}${notesTag}</span>
          <span style="color:#5C0F0F; font-weight:700; font-size:13px; white-space:nowrap;">${qtyStr}</span>
          <span style="display:flex; align-items:center; margin-left:4px;">${revealHtml}</span>
        </div>
      `;
    }).join('');
  }
  const cc = document.getElementById('cartCount'); if (cc) cc.textContent = CART.length + '개';
  const tq = document.getElementById('totalQty'); if (tq) tq.textContent = CART.length;
}

          onfocus="this.select()">
        <select id="editCartUnit" style="flex:1 1 auto; min-width:0; padding:10px 6px; font-size:13px; border:1px solid var(--line); border-radius:6px; box-sizing:border-box;">
          ${allowedUnits.map(u => `<option value="${u}"${item.unit===u?' selected':''}>${unitLong[u]}</option>`).join('')}

      </div>
      <div style="font-size:11px; color:var(--muted); font-weight:600; margin:12px 0 3px;">요청사항 (선택)</div>

window.closeCartEditModal = function() {
  const m = document.getElementById('cartEditModal');
  if (m) m.remove();
  window._editCartIdx = null;
};

window.saveCartEdit = function() {
  const idx = window._editCartIdx;
  if (idx == null || idx < 0 || idx >= CART.length) { closeCartEditModal(); return; }
  const qtyEl = document.getElementById('editCartQty');
  const unitEl = document.getElementById('editCartUnit');
  const notesEl = document.getElementById('editCartNotes');
  const qty = parseFloat(qtyEl.value);
  if (isNaN(qty) || qty <= 0) { alert('수량을 입력하세요.'); qtyEl.focus(); return; }
  CART[idx].quantity = qty;
  CART[idx].unit = unitEl.value;
  CART[idx].notes = (notesEl.value || '').trim();
  window._expandedCartIdx = null;
  closeCartEditModal();
  renderCart();
  _autoSaveCurrentCartDraft();
  // 즐겨찾기 카드 "🛒 N" 배지 갱신 (URL hash 기반 정확한 거래처 조회)
  const _cidE = _getCurrentOrderCustId();
  const _custS = _cidE ? DB.customers.find(c => c.id === _cidE) : null;
  if (_custS && typeof renderFavQuick === 'function') try { renderFavQuick(_custS); } catch(_){}
};
function estWeight(item, p) {
  if (item.unit === '박스') return (item.quantity||0) * p.boxKg;
  if (item.unit === '팩') return (item.quantity||0) * p.packKg;
  return (item.quantity||0); // 작업중량
}
// 배송일 뱃지 표시 — 오늘/내일/지난날짜를 색상으로 강조
function renderDeliveryBadge(dateISO) {
  if (!dateISO) return '<span style="color:var(--muted); font-size:11px;">미지정</span>';
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(dateISO + 'T00:00:00');
  const diff = Math.round((target.getTime() - today.getTime()) / (24*60*60*1000));
  const dmy = formatDateDMY(dateISO);
  let label, color, bg;
  if (diff === 0) { label = '오늘'; color = '#fff'; bg = '#D32F2F'; }
  else if (diff === 1) { label = '내일'; color = '#fff'; bg = '#F57C00'; }
  else if (diff < 0) { label = `${Math.abs(diff)}일 지남`; color = '#fff'; bg = '#9E9E9E'; }
  else if (diff <= 3) { label = `${diff}일 후`; color = '#5C0F0F'; bg = '#FFE082'; }
  else { label = `${diff}일 후`; color = 'var(--muted)'; bg = 'var(--surface)'; }
  return `<span style="display:inline-block; padding:2px 8px; border-radius:10px; background:${bg}; color:${color}; font-size:11px; font-weight:700; margin-right:4px;">${label}</span><span style="font-size:12px;">${dmy}</span>`;
}

//   흐름: viewOrder → [확인] → viewOrderConfirm → [주문 제출] → 배송일 모달
//   수정·삭제는 뒤로 가서 처리 (확인 화면은 검토 전용).

window.goToOrderConfirm = function(custId) {
  if (!Array.isArray(CART) || CART.length === 0) {
    return alert('주문 내역이 비어 있습니다.\nCart is empty.');
  }
  const emptyQty = CART.filter(it => it.quantity == null || it.quantity === '' || isNaN(it.quantity) || Number(it.quantity) <= 0);
  if (emptyQty.length > 0) {
    const names = emptyQty.map(it => {
      const p = DB.products.find(x => x.id === it.productId);
      return p ? p.name : '(품목)';
    }).join(', ');
    return alert('❌ 수량 미입력 품목이 있습니다:\n' + names + '\n\n수량을 입력해 주세요.\nPlease enter quantity for all items.');
  }
  // 요청사항 저장 (draft 에 이미 반영됨, 명시 저장으로 안전 보장)
  try { saveCartDraft(custId); } catch(_){}
  location.hash = '#orderConfirm?c=' + custId;
};

function viewOrderConfirm(params) {
  const custId = params.get('c');
  const cust = DB.customers.find(c => c.id === custId);
  const app = document.getElementById('app');
  app.classList?.add?.('narrow');

  if (!cust) {
    app.innerHTML = '<div class="card"><div class="empty"><div class="icon">🔒</div>거래처 정보가 없습니다.<br><small>No customer info.</small></div></div>';
    return;
  }

  // CART 가 비어 있으면 draft 에서 복원 (새로고침 대응)
  let cartItems = Array.isArray(CART) ? CART : [];
  let deliveryNotes = '';
  if (cartItems.length === 0) {
    const draft = loadCartDraft(custId);
    if (draft) {
      cartItems = Array.isArray(draft.cart) ? draft.cart : [];
      deliveryNotes = draft.deliveryNotes || '';
      CART = cartItems;
    }
  } else {
    const draft = loadCartDraft(custId);
    if (draft) deliveryNotes = draft.deliveryNotes || '';
  }

  if (cartItems.length === 0) {
    app.innerHTML = `<div class="card"><div class="empty"><div class="icon">📭</div>
      주문 내용이 없습니다.<br><small>Cart is empty.</small><br><br>
      <button class="btn" onclick="location.hash='#order?c=${custId}'">← 주문 화면으로 / Back to Order</button>
    </div></div>`;
    return;
  }

  const todayDisplay = new Date().toLocaleDateString('ko-KR', {year:'numeric', month:'long', day:'numeric', weekday:'short'});
  const esc = s => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const unitShort = { '박스':'box', '팩':'pack', '작업중량':'kg' };

  const rows = cartItems.map(item => {
    const p = DB.products.find(x => x.id === item.productId);
    if (!p) return '';
    const qtyDisp = (item.quantity == null || item.quantity === '' || isNaN(item.quantity)) ? '?' : item.quantity;
    const u = unitShort[item.unit] || item.unit || '';
    const notesPart = item.notes ? ` · <span style="color:var(--brand-dark); font-weight:600;">${esc(item.notes)}</span>` : '';
    return `<div style="padding:8px 12px; border-bottom:1px solid var(--line); font-size:14px; line-height:1.4;">
      <div style="font-weight:700; color:var(--ink);">${esc(p.name)}</div>
      <div style="font-size:12px; color:var(--muted); margin-top:2px;">
        <b style="color:var(--brand-dark);">${qtyDisp} ${u}</b>${notesPart}
      </div>
    </div>`;
  }).join('');

  app.innerHTML = `
    <h2 class="page-title" style="margin-bottom:6px;">🛒 ${esc(cust.name)}
      <span style="font-size:12px; font-weight:400; color:var(--muted); margin-left:8px;">${todayDisplay}</span>
    </h2>
    ${deliveryNotes ? `
    <div style="padding:8px 12px; margin-bottom:8px; background:#FFF7E0; border-left:4px solid #B8860B; border-radius:4px; font-size:13px;">
      <b style="color:#7A4A00;">📝 요청 / Notes:</b> <span style="color:#5C3A00;">${esc(deliveryNotes)}</span>
    </div>` : ''}
    <div class="card" style="padding:0; margin-bottom:70px;">
      <h3 style="margin:0; padding:10px 14px; border-bottom:1px solid var(--line); font-size:14px; background:var(--surface);">
        📦 주문 내용 / Order
        <span style="float:right; color:var(--muted); font-size:12px; font-weight:400;">${cartItems.length}개 · items</span>
      </h3>
      ${rows}
    </div>
    <div class="order-confirm-bar">
      <button class="ocb-back" onclick="location.hash='#order?c=${custId}'">← 주문서 / order</button>
      <button class="ocb-submit" onclick="confirmAndSubmitOrder('${custId}')">✅ 주문서 제출 / submit</button>
    </div>
  `;
}
