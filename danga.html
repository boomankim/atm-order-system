<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATM 매입단가</title>
<noscript>
  <meta http-equiv="refresh" content="0; url=https://claude.ai/public/artifacts/2c119526-f4b6-4519-90f1-57268dcf0652">
</noscript>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #F6F3EC;
    font-family: 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    color: #17352A;
  }
  .card {
    text-align: center;
    padding: 40px 24px;
    max-width: 420px;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 12px;
    letter-spacing: -0.5px;
  }
  p {
    font-size: 15px;
    margin: 0 0 24px;
    opacity: 0.75;
    line-height: 1.6;
  }
  .spinner {
    width: 36px;
    height: 36px;
    margin: 0 auto 24px;
    border: 4px solid rgba(23, 53, 42, 0.15);
    border-top-color: #17352A;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  a.manual {
    display: inline-block;
    padding: 12px 28px;
    background: #17352A;
    color: #F6F3EC;
    text-decoration: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
  }
  a.manual:hover { opacity: 0.9; }
  #install {
    display: none;
  }
  .steps {
    text-align: left;
    background: #FFFFFF;
    border: 1px solid rgba(23, 53, 42, 0.15);
    border-radius: 12px;
    padding: 20px 22px;
    margin: 0 0 24px;
    font-size: 15px;
    line-height: 2;
  }
  .steps b { color: #17352A; }
  .badge {
    display: inline-block;
    background: #17352A;
    color: #F6F3EC;
    border-radius: 999px;
    padding: 2px 10px;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 12px;
  }
</style>
</head>
<body>
  <div class="card" id="redirecting">
    <div class="spinner"></div>
    <h1>ATM 매입단가</h1>
    <p>매입단가 페이지로 이동 중입니다&hellip;<br>자동으로 이동하지 않으면 아래 버튼을 눌러주세요.</p>
    <a class="manual" href="https://claude.ai/public/artifacts/2c119526-f4b6-4519-90f1-57268dcf0652" target="_blank" rel="noopener">매입단가 열기</a>
  </div>

  <div class="card" id="install">
    <span class="badge">바로 가기 설치 모드</span>
    <h1>ATM 매입단가</h1>
    <div class="steps">
      지금 이 화면에서 그대로:<br>
      ① 브라우저 오른쪽 위(또는 아래) <b>⋮ 메뉴</b> 누르기<br>
      ② <b>"홈 화면에 추가"</b> 선택<br>
      ③ 이름 확인 후 <b>추가</b>
    </div>
    <p>이 화면은 자동 이동이 꺼져 있어서 천천히 추가하시면 됩니다.<br>홈 화면에 생긴 아이콘을 누르면 매입단가로 바로 이동해요.</p>
    <a class="manual" href="https://claude.ai/public/artifacts/2c119526-f4b6-4519-90f1-57268dcf0652" target="_blank" rel="noopener">매입단가 열기</a>
  </div>

  <script>
    (function () {
      var DEST = "https://claude.ai/public/artifacts/2c119526-f4b6-4519-90f1-57268dcf0652";
      var stay = /(^|[?&])stay=/.test(window.location.search);

      if (stay) {
        // 설치 모드: 리다이렉트 중단 + 주소를 깨끗한 danga.html로 교체
        // → "홈 화면에 추가" 시 바로 가기가 순수 danga.html을 가리키게 됨
        try {
          var clean = window.location.pathname;
          window.history.replaceState(null, "", clean);
        } catch (e) {}
        document.getElementById("redirecting").style.display = "none";
        document.getElementById("install").style.display = "block";
        return;
      }

      // 일반 모드: meta refresh + location.replace 이중 적용
      var meta = document.createElement("meta");
      meta.httpEquiv = "refresh";
      meta.content = "0; url=" + DEST;
      document.head.appendChild(meta);
      window.location.replace(DEST);
      setTimeout(function () { window.location.href = DEST; }, 1500);
    })();
  </script>
</body>
</html>
