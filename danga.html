<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATM 매입단가</title>
<meta name="theme-color" content="#17352A">
<link rel="icon" type="image/png" sizes="192x192" href="danga-icon-192.png">
<link rel="apple-touch-icon" href="danga-icon-192.png">
<link rel="manifest" href="danga.webmanifest">
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #F6F3EC;
    font-family: 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    color: #17352A;
  }
  .card {
    text-align: center;
    padding: 40px 28px;
    max-width: 420px;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 12px;
    letter-spacing: -0.5px;
  }
  p {
    font-size: 15px;
    line-height: 1.6;
    margin: 0 0 20px;
    opacity: 0.8;
  }
  .spinner {
    width: 36px;
    height: 36px;
    margin: 0 auto 24px;
    border: 4px solid rgba(23, 53, 42, 0.15);
    border-top-color: #17352A;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  a.manual {
    display: inline-block;
    padding: 12px 28px;
    background: #17352A;
    color: #F6F3EC;
    text-decoration: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
  }
  a.manual:hover { opacity: 0.9; }
  .badge {
    display: inline-block;
    background: #17352A;
    color: #F6F3EC;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 18px;
  }
  .steps {
    text-align: left;
    background: #fff;
    border-radius: 12px;
    padding: 18px 20px;
    font-size: 14px;
    line-height: 1.8;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .steps b { color: #17352A; }
  #installView { display: none; }
</style>
</head>
<body>

  <!-- 평소 화면: 자동 이동 -->
  <div class="card" id="redirectView">
    <div class="spinner"></div>
    <h1>ATM 매입단가</h1>
    <p>매입단가 화면으로 이동 중입니다…</p>
    <a class="manual" id="manualLink" href="#">바로 열기</a>
  </div>

  <!-- 설치 모드 화면: ?stay=1 -->
  <div class="card" id="installView">
    <div class="badge">바로 가기 설치 모드</div>
    <h1>ATM 매입단가</h1>
    <p>자동 이동이 꺼져 있습니다.<br>아래 순서대로 홈 화면에 추가해 주세요.</p>
    <div class="steps">
      1. 브라우저 오른쪽 위 <b>⋮ 메뉴</b>를 누르세요.<br>
      2. <b>"홈 화면에 추가"</b> (또는 "설치 및 바로가기 만들기")를 누르세요.<br>
      3. <b>"추가"</b>를 누르면 끝!<br><br>
      홈 화면 아이콘을 누르면 앞으로는<br>바로 매입단가로 이동합니다.
    </div>
  </div>

<script>
(function () {
  var TARGET = "https://claude.ai/public/artifacts/a0b563bf-08f4-45f2-86df-aabc96b14466";
  document.getElementById("manualLink").href = TARGET;

  var params = new URLSearchParams(location.search);
  var stay = params.get("stay") === "1" || location.hash === "#stay";

  // 깃허브 페이지(github.io)에서 열렸을 때만 자동 이동.
  // 클로드 미리보기나 컴퓨터에서 직접 열 때는 이동하지 않음.
  var onGitHub = location.hostname.indexOf("github.io") !== -1;

  if (stay || !onGitHub) {
    // 설치 모드: 이동하지 않고 안내 화면 표시
    document.getElementById("redirectView").style.display = "none";
    document.getElementById("installView").style.display = "block";
    // 주소를 깨끗한 danga.html 로 바꿔서, 홈 화면 추가 시 ?stay=1 없이 저장되게 함
    try {
      history.replaceState(null, "", location.pathname);
    } catch (e) {}
  } else {
    // 평소 모드: 매입단가 아티팩트로 자동 이동
    location.replace(TARGET);
  }
})();
</script>
</body>
</html>
